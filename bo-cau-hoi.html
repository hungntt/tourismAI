Mô hình hàng đầu được cộng thêm 50% token đầu ra cho phần suy luận. Chưa tính ưu đãi bộ nhớ đệm prompt và Batch API.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Số lượt gọi chia cho hai nhà cung cấp theo tỷ lệ ngân sách (7:5) để so sánh trực tiếp giữa các mô hình.\u003c/p>\u003c/li>\n\u003c/ul>\n\u003cp>Kết quả:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Kế hoạch cần khoảng 247.000 lượt gọi. Nếu toàn bộ chạy trên mô hình hàng đầu (kịch bản chi phí cao nhất), chi phí khoảng 10.500 USD, nằm trong mức 12.000 USD và còn dự phòng khoảng 14% cho biến động giá và số vòng lặp.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Nếu chuyển các tác vụ khối lượng lớn (kiểm thử hồi quy, chấm điểm, xử lý dữ liệu) sang mô hình nhỏ, cùng khối lượng chỉ khoảng 3.400 USD. Phần chênh lệch là dư địa để tăng khối lượng thử nghiệm: với cơ cấu trên, ngân sách đủ cho khoảng 280.000 lượt (toàn bộ dùng mô hình hàng đầu) đến 870.000 lượt (chuyển tác vụ khối lượng lớn sang mô hình nhỏ).\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"4.3","sec":"4","q":"\"Nghiên cứu, hiệu chỉnh mô hình AI tạo sinh chuyên biệt\" nêu trong Thuyết minh cụ thể là tinh chỉnh (fine-tuning) hay chỉ prompt engineering kết hợp RAG?","topics":["cong-nghe"],"t":"Giai đoạn đầu, tập trung dùng kỹ thuật truy xuất tăng cường (RAG) kết hợp thiết kế prompt chuyên biệt cho ngữ cảnh du lịch tỉnh Gia Lai trên nền các mô hình thương mại nêu trên. Giai đoạn sau sẽ chưng cất dữ liệu để hiệu chỉnh và tối ưu các mô hình.","a":"\u003cp>Giai đoạn đầu, tập trung dùng kỹ thuật truy xuất tăng cường (RAG) kết hợp thiết kế prompt chuyên biệt cho ngữ cảnh du lịch tỉnh Gia Lai trên nền các mô hình thương mại nêu trên. Giai đoạn sau sẽ chưng cất dữ liệu để hiệu chỉnh và tối ưu các mô hình.\u003c/p>"},{"id":"5.1","sec":"5","q":"Luồng truy xuất thông tin từ cơ sở dữ liệu du lịch tỉnh Gia Lai cho chatbot và tạo nội dung hoạt động như thế nào? Dùng mô hình nhúng (embedding) và cơ sở dữ liệu véc-tơ nào? Độ chính xác truy xuất được đánh giá ra sao?","topics":["cong-nghe","du-lieu"],"t":"Dữ liệu du lịch sau khi thu thập sẽ được chuẩn hóa và gắn siêu dữ liệu (loại hình du lịch, vùng địa lý, ngôn ngữ), chuyển thành véc-tơ nhúng (embedding), rồi lưu trữ và tìm kiếm bằng dịch vụ Azure AI Search (đã có trong dự toán, khoản 60 triệu đồng). Khi có truy vấn từ người dùng, hệ thống tính véc-tơ của câu hỏi, tìm kiếm ngữ nghĩa để lấy ra các đoạn dữ liệu liên quan nhất, sau đó đưa các đoạn này làm ngữ cảnh cho mô hình ngôn ngữ sinh câu trả lời, kèm khả năng trích dẫn nguồn. Việc lưu trữ dữ liệu có cấu trúc (điểm đến, sự kiện, dịch vụ) và dữ liệu hình ảnh/video gốc được tách riêng, sử dụng Azure Database for SQL và Azure Blob Storage (đã có trong dự toán) để thuận tiện quản lý và phân quyền.\nĐộ chính xác truy xuất sẽ được đánh giá bằng một bộ câu hỏi kiểm thử do chuyên gia du lịch xây dựng, đo tỷ lệ truy xuất đúng trong nhóm kết quả trả về hàng đầu, kết hợp đánh giá định tính của chuyên gia về mức độ phù hợp ngữ cảnh.","a":"\u003cp>Dữ liệu du lịch sau khi thu thập sẽ được chuẩn hóa và gắn siêu dữ liệu (loại hình du lịch, vùng địa lý, ngôn ngữ), chuyển thành véc-tơ nhúng (embedding), rồi lưu trữ và tìm kiếm bằng dịch vụ Azure AI Search (đã có trong dự toán, khoản 60 triệu đồng). Khi có truy vấn từ người dùng, hệ thống tính véc-tơ của câu hỏi, tìm kiếm ngữ nghĩa để lấy ra các đoạn dữ liệu liên quan nhất, sau đó đưa các đoạn này làm ngữ cảnh cho mô hình ngôn ngữ sinh câu trả lời, kèm khả năng trích dẫn nguồn. Việc lưu trữ dữ liệu có cấu trúc (điểm đến, sự kiện, dịch vụ) và dữ liệu hình ảnh/video gốc được tách riêng, sử dụng Azure Database for SQL và Azure Blob Storage (đã có trong dự toán) để thuận tiện quản lý và phân quyền.\u003c/p>\n\u003cp>Độ chính xác truy xuất sẽ được đánh giá bằng một bộ câu hỏi kiểm thử do chuyên gia du lịch xây dựng, đo tỷ lệ truy xuất đúng trong nhóm kết quả trả về hàng đầu, kết hợp đánh giá định tính của chuyên gia về mức độ phù hợp ngữ cảnh.\u003c/p>"},{"id":"6.1","sec":"6","q":"Bộ dữ liệu ban đầu (tối thiểu 100 bài viết, 20 video) có đủ để bảo đảm chất lượng nội dung tạo sinh cho toàn bộ không gian du lịch \"rừng - biển - văn hóa bản địa\" của tỉnh Gia Lai sau sáp nhập, bao gồm các vùng và văn hóa các dân tộc khác nhau? Dữ liệu thu thập từ mạng xã hội, đơn vị du lịch được xử lý bản quyền như thế nào?","topics":["du-lieu"],"t":"Bộ dữ liệu 100 bài viết và 20 video là dữ liệu khởi tạo để kiểm chứng pipeline kỹ thuật và phục vụ vận hành và nghiệm thu. Trong suốt 24 tháng triển khai, dữ liệu sẽ luôn được kiểm nghiệm thông qua khảo sát thực địa ở Nội dung 1, phối hợp với ba đơn vị đã ký cam kết và với Sở Văn hóa, Thể thao và Du lịch, theo nguyên tắc phân bổ cân đối giữa các vùng địa lý (biển, rừng, đô thị) và các nhóm văn hóa để tránh thiên lệch về một khu vực.\nVề bản quyền, nhóm áp dụng quy trình ba bước: kiểm kê nguồn dữ liệu, xin phép hoặc ghi nhận tác quyền, và gắn nhãn nguồn gốc trong siêu dữ liệu trước khi đưa vào hệ thống; dữ liệu được ưu tiên là dữ liệu tự thu thập hoặc được các đơn vị phối hợp cung cấp có sự đồng ý, hạn chế tối đa việc sử dụng nội dung chưa rõ quyền sử dụng từ mạng xã hội.","a":"\u003cp>Bộ dữ liệu 100 bài viết và 20 video là dữ liệu khởi tạo để kiểm chứng pipeline kỹ thuật và phục vụ vận hành và nghiệm thu. Trong suốt 24 tháng triển khai, dữ liệu sẽ luôn được kiểm nghiệm thông qua khảo sát thực địa ở Nội dung 1, phối hợp với ba đơn vị đã ký cam kết và với Sở Văn hóa, Thể thao và Du lịch, theo nguyên tắc phân bổ cân đối giữa các vùng địa lý (biển, rừng, đô thị) và các nhóm văn hóa để tránh thiên lệch về một khu vực.\u003c/p>\n\u003cp>Về bản quyền, nhóm áp dụng quy trình ba bước: kiểm kê nguồn dữ liệu, xin phép hoặc ghi nhận tác quyền, và gắn nhãn nguồn gốc trong siêu dữ liệu trước khi đưa vào hệ thống; dữ liệu được ưu tiên là dữ liệu tự thu thập hoặc được các đơn vị phối hợp cung cấp có sự đồng ý, hạn chế tối đa việc sử dụng nội dung chưa rõ quyền sử dụng từ mạng xã hội.\u003c/p>"},{"id":"7.1","sec":"7","q":"Việc hỗ trợ 4 ngôn ngữ (Việt, Anh, Trung, Nhật) dựa vào khả năng đa ngôn ngữ sẵn có của mô hình hay có lớp dịch/hiệu đính riêng?","topics":["ngon-ngu"],"t":"Hệ thống tận dụng khả năng đa ngôn ngữ sẵn có của các mô hình ngôn ngữ lớn hiện đại, vốn đã hỗ trợ tốt tiếng Anh, tiếng Trung và tiếng Nhật ở mức giao tiếp thông thường, kết hợp thêm một bảng thuật ngữ chuẩn hóa (glossary) do nhóm xây dựng riêng cho tên địa danh, món ăn, lễ hội và các thuật ngữ văn hóa - du lịch đặc thù của Gia Lai, để bảo đảm nhất quán khi hệ thống trả lời hoặc dịch nội dung. Nhóm có các chuyên gia ngôn ngữ đóng vai trò kiểm định chất lượng nội dung dịch thuật.","a":"\u003cp>Hệ thống tận dụng khả năng đa ngôn ngữ sẵn có của các mô hình ngôn ngữ lớn hiện đại, vốn đã hỗ trợ tốt tiếng Anh, tiếng Trung và tiếng Nhật ở mức giao tiếp thông thường, kết hợp thêm một bảng thuật ngữ chuẩn hóa (glossary) do nhóm xây dựng riêng cho tên địa danh, món ăn, lễ hội và các thuật ngữ văn hóa - du lịch đặc thù của Gia Lai, để bảo đảm nhất quán khi hệ thống trả lời hoặc dịch nội dung. Nhóm có các chuyên gia ngôn ngữ đóng vai trò kiểm định chất lượng nội dung dịch thuật.\u003c/p>"},{"id":"7.2","sec":"7","q":"Thuyết minh xác định Hàn Quốc là thị trường mục tiêu, vì sao chưa hỗ trợ tiếng Hàn? Hệ thống có hỗ trợ tiếng dân tộc thiểu số (Gia Rai, Ba Na) không?","topics":["ngon-ngu"],"t":"Bốn ngôn ngữ là mức tối thiểu cam kết; Thuyết minh (Nội dung 4) đã định hướng mở rộng tiếng Hàn, Đức, Pháp ở giai đoạn sau. Chi phí kỹ thuật để bổ sung thấp do mô hình đã hỗ trợ tốt tiếng Hàn; phần cần đầu tư là bảng thuật ngữ và kiểm định của chuyên gia ngôn ngữ, nên nhóm ưu tiên bảo đảm chất lượng 4 ngôn ngữ trong 24 tháng.\nTiếng dân tộc thiểu số chưa thuộc phạm vi đề tài do dữ liệu số hóa còn hạn chế và mô hình hiện chưa xử lý đủ tin cậy. Văn hóa các dân tộc được giới thiệu bằng 4 ngôn ngữ, nội dung được chuyên gia văn hóa thẩm định trước khi sử dụng.","a":"\u003cp>Bốn ngôn ngữ là mức tối thiểu cam kết; Thuyết minh (Nội dung 4) đã định hướng mở rộng tiếng Hàn, Đức, Pháp ở giai đoạn sau. Chi phí kỹ thuật để bổ sung thấp do mô hình đã hỗ trợ tốt tiếng Hàn; phần cần đầu tư là bảng thuật ngữ và kiểm định của chuyên gia ngôn ngữ, nên nhóm ưu tiên bảo đảm chất lượng 4 ngôn ngữ trong 24 tháng.\u003c/p>\n\u003cp>Tiếng dân tộc thiểu số chưa thuộc phạm vi đề tài do dữ liệu số hóa còn hạn chế và mô hình hiện chưa xử lý đủ tin cậy. Văn hóa các dân tộc được giới thiệu bằng 4 ngôn ngữ, nội dung được chuyên gia văn hóa thẩm định trước khi sử dụng.\u003c/p>"},{"id":"8.1","sec":"8","q":"Làm thế nào để bảo đảm chatbot và các mô-đun tạo nội dung không tạo ra thông tin sai lệch (hallucination) về điểm đến, giá cả, lịch sử, văn hóa?","topics":["chat-luong"],"t":"Hệ thống được thiết kế theo nguyên tắc \"trả lời có căn cứ\": câu trả lời của chatbot chỉ được sinh dựa trên các đoạn dữ liệu truy xuất được từ cơ sở dữ liệu và giao thức API đã kiểm duyệt, thay vì để mô hình tự do suy diễn.\nKhi không tìm được thông tin đủ tin cậy, hệ thống sẽ trả lời ở mức thận trọng hoặc từ chối trả lời. Bên cạnh đó, một bộ lọc an toàn nội dung sẽ kiểm tra kết quả trước khi trả về người dùng.\nĐối với nội dung marketing (bài viết, kịch bản video), sản phẩm đầu ra không được đăng tải tự động mà phải qua vòng kiểm duyệt của biên tập viên/chuyên gia. Hệ thống cũng có chức năng gắn cờ nội dung nghi ngờ sai lệch, làm cơ sở để đội kỹ thuật rà soát và cập nhật dữ liệu.","a":"\u003cp>Hệ thống được thiết kế theo nguyên tắc \"trả lời có căn cứ\": câu trả lời của chatbot chỉ được sinh dựa trên các đoạn dữ liệu truy xuất được từ cơ sở dữ liệu và giao thức API đã kiểm duyệt, thay vì để mô hình tự do suy diễn.\u003c/p>\n\u003cp>Khi không tìm được thông tin đủ tin cậy, hệ thống sẽ trả lời ở mức thận trọng hoặc từ chối trả lời. Bên cạnh đó, một bộ lọc an toàn nội dung sẽ kiểm tra kết quả trước khi trả về người dùng.\u003c/p>\n\u003cp>Đối với nội dung marketing (bài viết, kịch bản video), sản phẩm đầu ra không được đăng tải tự động mà phải qua vòng kiểm duyệt của biên tập viên/chuyên gia. Hệ thống cũng có chức năng gắn cờ nội dung nghi ngờ sai lệch, làm cơ sở để đội kỹ thuật rà soát và cập nhật dữ liệu.\u003c/p>"},{"id":"8.2","sec":"8","q":"Giá cả, giờ mở cửa, lịch sự kiện thay đổi liên tục; làm sao để chatbot không trả lời thông tin đã lỗi thời?","topics":["chat-luong","du-lieu"],"t":"Mỗi bản ghi trong cơ sở dữ liệu có nguồn và thời điểm cập nhật. Doanh nghiệp được phân quyền tự cập nhật dữ liệu dịch vụ của mình, Sở cập nhật sự kiện và điểm đến theo định kỳ (mục 13.2 Thuyết minh). Khi truy xuất, hệ thống ưu tiên dữ liệu mới nhất; câu trả lời về thông tin dễ biến động (giá, giờ mở cửa, lịch sự kiện) kèm ngày cập nhật và nguồn chính thức để du khách đối chiếu. Bản ghi quá thời hạn cập nhật được cảnh báo trên giao diện quản trị để rà soát.","a":"\u003cp>Mỗi bản ghi trong cơ sở dữ liệu có nguồn và thời điểm cập nhật. Doanh nghiệp được phân quyền tự cập nhật dữ liệu dịch vụ của mình, Sở cập nhật sự kiện và điểm đến theo định kỳ (mục 13.2 Thuyết minh). Khi truy xuất, hệ thống ưu tiên dữ liệu mới nhất; câu trả lời về thông tin dễ biến động (giá, giờ mở cửa, lịch sự kiện) kèm ngày cập nhật và nguồn chính thức để du khách đối chiếu. Bản ghi quá thời hạn cập nhật được cảnh báo trên giao diện quản trị để rà soát.\u003c/p>"},{"id":"8.3","sec":"8","q":"Nếu chatbot tư vấn sai khiến du khách bị thiệt hại thì trách nhiệm thuộc về ai?","topics":["chat-luong","phap-ly"],"t":"Hệ thống thông báo rõ người dùng đang tương tác với AI và thông tin mang tính tham khảo, kèm trích dẫn nguồn (mục 12). Với thông tin có thể gây thiệt hại như giá, an toàn hoặc dịch vụ, câu trả lời dẫn tới nguồn chính thức hoặc đơn vị cung cấp dịch vụ; chatbot không thực hiện giao dịch thay người dùng. Trách nhiệm của các bên được quy định trong điều khoản sử dụng do đơn vị tiếp nhận ban hành; sai sót được tiếp nhận qua chức năng phản hồi và xử lý theo quy trình ở mục 16.","a":"\u003cp>Hệ thống thông báo rõ người dùng đang tương tác với AI và thông tin mang tính tham khảo, kèm trích dẫn nguồn (mục \u003ca class=\"xref\" href=\"#sec-12\" data-sec=\"12\">12\u003c/a>). Với thông tin có thể gây thiệt hại như giá, an toàn hoặc dịch vụ, câu trả lời dẫn tới nguồn chính thức hoặc đơn vị cung cấp dịch vụ; chatbot không thực hiện giao dịch thay người dùng. Trách nhiệm của các bên được quy định trong điều khoản sử dụng do đơn vị tiếp nhận ban hành; sai sót được tiếp nhận qua chức năng phản hồi và xử lý theo quy trình ở mục \u003ca class=\"xref\" href=\"#sec-16\" data-sec=\"16\">16\u003c/a>.\u003c/p>"},{"id":"9.1","sec":"9","q":"Các chỉ tiêu \"thời gian phản hồi không quá 03 giây\", \"tối thiểu 80% lượt đánh giá hữu ích\", \"giảm khoảng 50% thời gian sản xuất nội dung\", \"tăng tối thiểu 20% hiệu quả quảng bá\" được đo bằng phương pháp, cỡ mẫu và mốc so sánh (baseline) nào?","topics":["do-luong"],"t":"Thời gian phản hồi được đo bằng Azure Monitor và công cụ kiểm thử tải Azure Load Testing, ghi nhận khoảng thời gian từ lúc gửi truy vấn đến khi nhận câu trả lời đầy đủ, kiểm thử trong kịch bản tải giả lập với số người dùng đồng thời tương ứng quy mô thí điểm trước khi triển khai thực tế.\nTỷ lệ đánh giá hữu ích được thu thập trực tiếp qua chức năng đánh giá (hữu ích/không hữu ích hoặc thang điểm) tích hợp ngay trong ứng dụng, tính trên toàn bộ lượt tương tác trong giai đoạn thử nghiệm ở Bước 6 của thiết kế nghiên cứu.\nĐối với chỉ tiêu giảm thời gian sản xuất nội dung, nhóm sẽ khảo sát thời gian trung bình hiện tại để tạo một bài viết hoặc một kịch bản video tại các đơn vị phối hợp và Sở Văn hóa, Thể thao và Du lịch ngay ở Nội dung 1. Đây là mốc so sánh (baseline) để đối chiếu với thời gian thực hiện khi có công cụ AI hỗ trợ. Chỉ tiêu tăng hiệu quả quảng bá được đo qua các chỉ số truyền thông cụ thể (lượt tiếp cận, lượt tương tác) trên các kênh của nhóm đơn vị/doanh nghiệp tham gia thí điểm, so sánh giai đoạn trước và sau khi áp dụng công cụ.","a":"\u003cp>Thời gian phản hồi được đo bằng Azure Monitor và công cụ kiểm thử tải Azure Load Testing, ghi nhận khoảng thời gian từ lúc gửi truy vấn đến khi nhận câu trả lời đầy đủ, kiểm thử trong kịch bản tải giả lập với số người dùng đồng thời tương ứng quy mô thí điểm trước khi triển khai thực tế.\u003c/p>\n\u003cp>Tỷ lệ đánh giá hữu ích được thu thập trực tiếp qua chức năng đánh giá (hữu ích/không hữu ích hoặc thang điểm) tích hợp ngay trong ứng dụng, tính trên toàn bộ lượt tương tác trong giai đoạn thử nghiệm ở Bước 6 của thiết kế nghiên cứu.\u003c/p>\n\u003cp>Đối với chỉ tiêu giảm thời gian sản xuất nội dung, nhóm sẽ khảo sát thời gian trung bình hiện tại để tạo một bài viết hoặc một kịch bản video tại các đơn vị phối hợp và Sở Văn hóa, Thể thao và Du lịch ngay ở Nội dung 1. Đây là mốc so sánh (baseline) để đối chiếu với thời gian thực hiện khi có công cụ AI hỗ trợ. Chỉ tiêu tăng hiệu quả quảng bá được đo qua các chỉ số truyền thông cụ thể (lượt tiếp cận, lượt tương tác) trên các kênh của nhóm đơn vị/doanh nghiệp tham gia thí điểm, so sánh giai đoạn trước và sau khi áp dụng công cụ.\u003c/p>"},{"id":"9.2","sec":"9","q":"Cam kết thời gian phản hồi không quá 03 giây có khả thi khi dùng mô hình ngôn ngữ lớn kết hợp truy xuất dữ liệu không?","topics":["do-luong","cong-nghe"],"t":"Khả thi đối với câu hỏi thông thường nhờ các biện pháp: dùng mô hình nhỏ, tốc độ cao cho câu hỏi phổ biến, chỉ chuyển sang mô hình hàng đầu khi cần (mục 4); lưu đệm câu trả lời phổ biến; giới hạn độ dài câu trả lời; truy xuất song song và đặt hạ tầng gần người dùng. Câu trả lời được hiển thị dạng luồng (streaming) để giảm thời gian chờ. Chỉ tiêu được đo trong kịch bản tải thử nghiệm và báo cáo theo phân vị (ví dụ 90% số lượt) thay vì chỉ giá trị trung bình.","a":"\u003cp>Khả thi đối với câu hỏi thông thường nhờ các biện pháp: dùng mô hình nhỏ, tốc độ cao cho câu hỏi phổ biến, chỉ chuyển sang mô hình hàng đầu khi cần (mục \u003ca class=\"xref\" href=\"#sec-4\" data-sec=\"4\">4\u003c/a>); lưu đệm câu trả lời phổ biến; giới hạn độ dài câu trả lời; truy xuất song song và đặt hạ tầng gần người dùng. Câu trả lời được hiển thị dạng luồng (streaming) để giảm thời gian chờ. Chỉ tiêu được đo trong kịch bản tải thử nghiệm và báo cáo theo phân vị (ví dụ 90% số lượt) thay vì chỉ giá trị trung bình.\u003c/p>"},{"id":"9.3","sec":"9","q":"Cần cỡ mẫu bao nhiêu để kết luận tỷ lệ đánh giá hữu ích đạt tối thiểu 80%?","topics":["do-luong"],"t":"Với tỷ lệ kỳ vọng 80%, để ước lượng với sai số ±5% ở độ tin cậy 95% cần tối thiểu khoảng 246 lượt đánh giá (n = 1,96² × 0,8 × 0,2 / 0,05²). Nhóm đặt mục tiêu tối thiểu 250 lượt đánh giá cho mỗi ngôn ngữ, tức khoảng 1.000 lượt trong giai đoạn thử nghiệm (Bước 6), thu từ nhiều nhóm người dùng: du khách trong nước, du khách quốc tế, cán bộ quản lý và doanh nghiệp.","a":"\u003cp>Với tỷ lệ kỳ vọng 80%, để ước lượng với sai số ±5% ở độ tin cậy 95% cần tối thiểu khoảng 246 lượt đánh giá (n = 1,96² × 0,8 × 0,2 / 0,05²). Nhóm đặt mục tiêu tối thiểu 250 lượt đánh giá cho mỗi ngôn ngữ, tức khoảng 1.000 lượt trong giai đoạn thử nghiệm (Bước 6), thu từ nhiều nhóm người dùng: du khách trong nước, du khách quốc tế, cán bộ quản lý và doanh nghiệp.\u003c/p>"},{"id":"10.1","sec":"10","q":"Hệ thống được bảo đảm an toàn thông tin như thế nào?","topics":["bao-mat"],"t":"An toàn thông tin được đưa vào ngay từ khâu thiết kế (Nội dung 7 của Thuyết minh), theo nguyên tắc bảo vệ nhiều lớp:\n• Mạng và hạ tầng: tách biệt môi trường phát triển, thử nghiệm và vận hành; chỉ công khai các điểm truy cập cần thiết thông qua cổng API (Azure API Management); mã hóa dữ liệu khi truyền tải và khi lưu trữ.\n• Danh tính và truy cập: xác thực người dùng; phân quyền theo vai trò (du khách, doanh nghiệp, cơ quan quản lý, quản trị, vận hành) và theo nguyên tắc quyền tối thiểu; mỗi doanh nghiệp chỉ truy cập dữ liệu và nội dung của mình; tài khoản quản trị dùng xác thực đa yếu tố.\n• Mã nguồn và bí mật: mật khẩu, khóa truy cập dịch vụ không lưu trực tiếp trong mã nguồn (đúng yêu cầu nêu tại sản phẩm \"Mã nguồn\" trong Thuyết minh), được quản lý tập trung và thay đổi định kỳ.\n• Giám sát: ghi nhật ký, giám sát hiệu năng và cảnh báo bất thường bằng Azure Monitor (thuộc hạng mục Giám sát và bảo mật trong dự toán).\n• Sao lưu và khôi phục: sao lưu định kỳ và kiểm tra khả năng khôi phục dữ liệu.\n• Kiểm thử: rà quét lỗ hổng, kiểm thử bảo mật và kiểm thử xâm nhập trước khi vận hành thử nghiệm và trước nghiệm thu; khắc phục các điểm yếu phát hiện được trước khi công bố hệ thống.","a":"\u003cp>An toàn thông tin được đưa vào ngay từ khâu thiết kế (Nội dung 7 của Thuyết minh), theo nguyên tắc bảo vệ nhiều lớp:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Mạng và hạ tầng:\u003c/strong> tách biệt môi trường phát triển, thử nghiệm và vận hành; chỉ công khai các điểm truy cập cần thiết thông qua cổng API (Azure API Management); mã hóa dữ liệu khi truyền tải và khi lưu trữ.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Danh tính và truy cập:\u003c/strong> xác thực người dùng; phân quyền theo vai trò (du khách, doanh nghiệp, cơ quan quản lý, quản trị, vận hành) và theo nguyên tắc quyền tối thiểu; mỗi doanh nghiệp chỉ truy cập dữ liệu và nội dung của mình; tài khoản quản trị dùng xác thực đa yếu tố.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Mã nguồn và bí mật:\u003c/strong> mật khẩu, khóa truy cập dịch vụ không lưu trực tiếp trong mã nguồn (đúng yêu cầu nêu tại sản phẩm \"Mã nguồn\" trong Thuyết minh), được quản lý tập trung và thay đổi định kỳ.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Giám sát:\u003c/strong> ghi nhật ký, giám sát hiệu năng và cảnh báo bất thường bằng Azure Monitor (thuộc hạng mục Giám sát và bảo mật trong dự toán).\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Sao lưu và khôi phục:\u003c/strong> sao lưu định kỳ và kiểm tra khả năng khôi phục dữ liệu.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Kiểm thử:\u003c/strong> rà quét lỗ hổng, kiểm thử bảo mật và kiểm thử xâm nhập trước khi vận hành thử nghiệm và trước nghiệm thu; khắc phục các điểm yếu phát hiện được trước khi công bố hệ thống.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"10.2","sec":"10","q":"Hệ thống có phải xác định cấp độ an ninh mạng không? Nhóm thực hiện như thế nào?","topics":["bao-mat","phap-ly"],"t":"Theo Luật An ninh mạng 2025 (có hiệu lực từ 01/07/2026), hệ thống thông tin được phân loại theo năm cấp độ. Nhóm sẽ phối hợp đơn vị tiếp nhận (dự kiến là Sở Văn hóa, Thể thao và Du lịch) xác định cấp độ và xây dựng hồ sơ đề xuất cấp độ ngay từ giai đoạn thiết kế, đồng thời áp dụng các biện pháp bảo vệ tương ứng theo tiêu chuẩn quốc gia TCVN 14423:2026 (thay thế TCVN 11930:2017), không chờ đến khi hồ sơ được phê duyệt. Việc thẩm định, phê duyệt thực hiện theo hướng dẫn của cơ quan có thẩm quyền tại thời điểm trình hồ sơ.","a":"\u003cp>Theo Luật An ninh mạng 2025 (có hiệu lực từ 01/07/2026), hệ thống thông tin được phân loại theo năm cấp độ. Nhóm sẽ phối hợp đơn vị tiếp nhận (dự kiến là Sở Văn hóa, Thể thao và Du lịch) xác định cấp độ và xây dựng hồ sơ đề xuất cấp độ ngay từ giai đoạn thiết kế, đồng thời áp dụng các biện pháp bảo vệ tương ứng theo tiêu chuẩn quốc gia TCVN 14423:2026 (thay thế TCVN 11930:2017), không chờ đến khi hồ sơ được phê duyệt. Việc thẩm định, phê duyệt thực hiện theo hướng dẫn của cơ quan có thẩm quyền tại thời điểm trình hồ sơ.\u003c/p>"},{"id":"10.3","sec":"10","q":"Quy trình xử lý khi xảy ra sự cố an toàn thông tin hoặc lộ lọt dữ liệu?","topics":["bao-mat","ca-nhan"],"t":"Quy trình gồm: (1) phát hiện truy cập hoặc hành vi bất thường qua hệ thống giám sát; (2) bộ phận kỹ thuật xác minh và khoanh vùng phạm vi ảnh hưởng; (3) khóa quyền truy cập, thu hồi hoặc thay khóa liên quan, cô lập thành phần bị ảnh hưởng; (4) khôi phục từ bản sao lưu và kiểm thử lại; (5) rà soát nguyên nhân, cập nhật phân quyền và biện pháp bảo mật.\nTrường hợp liên quan đến dữ liệu cá nhân, nhóm phối hợp đơn vị chủ quản thông báo cho cơ quan có thẩm quyền và người dùng bị ảnh hưởng trong thời hạn pháp luật quy định. Quy trình, kịch bản xử lý và đầu mối liên hệ được đưa vào tài liệu vận hành bàn giao cho đơn vị tiếp nhận.","a":"\u003cp>Quy trình gồm: (1) phát hiện truy cập hoặc hành vi bất thường qua hệ thống giám sát; (2) bộ phận kỹ thuật xác minh và khoanh vùng phạm vi ảnh hưởng; (3) khóa quyền truy cập, thu hồi hoặc thay khóa liên quan, cô lập thành phần bị ảnh hưởng; (4) khôi phục từ bản sao lưu và kiểm thử lại; (5) rà soát nguyên nhân, cập nhật phân quyền và biện pháp bảo mật.\u003c/p>\n\u003cp>Trường hợp liên quan đến dữ liệu cá nhân, nhóm phối hợp đơn vị chủ quản thông báo cho cơ quan có thẩm quyền và người dùng bị ảnh hưởng trong thời hạn pháp luật quy định. Quy trình, kịch bản xử lý và đầu mối liên hệ được đưa vào tài liệu vận hành bàn giao cho đơn vị tiếp nhận.\u003c/p>"},{"id":"10.4","sec":"10","q":"Ai chịu trách nhiệm bảo đảm an toàn thông tin trong và sau thời gian thực hiện đề tài?","topics":["bao-mat","doi-ngu"],"t":"Trong thời gian thực hiện, ThS. Nguyễn Võ Thành Khang phụ trách an toàn AI và đánh giá độ tin cậy; CN. Lâm Hải Sơn phụ trách quản trị và bảo đảm an toàn dữ liệu; ThS. NCS. Nguyễn Trương Thành Hưng chịu trách nhiệm thiết kế kiến trúc và kiểm soát độ tin cậy.\nSau nghiệm thu, đề tài chuyển giao tài liệu vận hành, quy trình ứng phó sự cố và đào tạo cán bộ của đơn vị tiếp nhận để đơn vị chủ động bố trí đầu mối an toàn thông tin; nhóm hỗ trợ kỹ thuật trong giai đoạn vận hành thử nghiệm và sau nghiệm thu như cam kết trong Thuyết minh.","a":"\u003cp>Trong thời gian thực hiện, ThS. Nguyễn Võ Thành Khang phụ trách an toàn AI và đánh giá độ tin cậy; CN. Lâm Hải Sơn phụ trách quản trị và bảo đảm an toàn dữ liệu; ThS. NCS. Nguyễn Trương Thành Hưng chịu trách nhiệm thiết kế kiến trúc và kiểm soát độ tin cậy.\u003c/p>\n\u003cp>Sau nghiệm thu, đề tài chuyển giao tài liệu vận hành, quy trình ứng phó sự cố và đào tạo cán bộ của đơn vị tiếp nhận để đơn vị chủ động bố trí đầu mối an toàn thông tin; nhóm hỗ trợ kỹ thuật trong giai đoạn vận hành thử nghiệm và sau nghiệm thu như cam kết trong Thuyết minh.\u003c/p>"},{"id":"11.1","sec":"11","q":"Cơ chế mã hóa, phân quyền, ẩn danh hóa dữ liệu người dùng cụ thể là gì? Nếu sử dụng API mô hình AI của nước ngoài, dữ liệu hội thoại/dữ liệu người dùng có được gửi ra nước ngoài xử lý không, và có tuân thủ quy định về bảo vệ dữ liệu cá nhân hiện hành không?","topics":["ca-nhan","phap-ly"],"t":"Hệ thống phân tách rõ hai luồng dữ liệu: dữ liệu tri thức du lịch công khai (thông tin điểm đến, văn hóa, dịch vụ...) không mang tính nhạy cảm cá nhân, có thể được xử lý qua API mô hình AI bên ngoài nếu sử dụng dịch vụ thương mại. Còn dữ liệu liên quan đến người dùng (lịch sử hội thoại, hành vi sử dụng) sẽ được mã hoá và loại bỏ thông tin định danh trước khi phục vụ mục đích phân tích.\nĐể trả lời, câu hỏi của du khách cùng các đoạn dữ liệu du lịch truy xuất được sẽ được gửi tới API mô hình ngôn ngữ; trước khi gửi, hệ thống loại bỏ thông tin định danh trong câu hỏi và không kèm dữ liệu tài khoản, lịch sử gắn danh tính hay vị trí chính xác (xem mục 12). Dữ liệu cá nhân của người dùng không được dùng để huấn luyện hay hiệu chỉnh mô hình.\nVề kỹ thuật, hệ thống áp dụng mã hóa dữ liệu khi lưu trữ và khi truyền tải, phân quyền truy cập theo vai trò cho từng nhóm người dùng (quản trị, doanh nghiệp, người vận hành), và sao lưu dữ liệu định kỳ. Thiết kế hệ thống bám theo yêu cầu của Luật Bảo vệ dữ liệu cá nhân 2025 (có hiệu lực từ 01/01/2026) và Nghị định 356/2025/NĐ-CP, bao gồm việc thông báo rõ mục đích thu thập dữ liệu và cho phép người dùng yêu cầu xóa dữ liệu cá nhân khi cần.","a":"\u003cp>Hệ thống phân tách rõ hai luồng dữ liệu: dữ liệu tri thức du lịch công khai (thông tin điểm đến, văn hóa, dịch vụ...) không mang tính nhạy cảm cá nhân, có thể được xử lý qua API mô hình AI bên ngoài nếu sử dụng dịch vụ thương mại. Còn dữ liệu liên quan đến người dùng (lịch sử hội thoại, hành vi sử dụng) sẽ được mã hoá và loại bỏ thông tin định danh trước khi phục vụ mục đích phân tích.\u003c/p>\n\u003cp>Để trả lời, câu hỏi của du khách cùng các đoạn dữ liệu du lịch truy xuất được sẽ được gửi tới API mô hình ngôn ngữ; trước khi gửi, hệ thống loại bỏ thông tin định danh trong câu hỏi và không kèm dữ liệu tài khoản, lịch sử gắn danh tính hay vị trí chính xác (xem mục \u003ca class=\"xref\" href=\"#sec-12\" data-sec=\"12\">12\u003c/a>). Dữ liệu cá nhân của người dùng không được dùng để huấn luyện hay hiệu chỉnh mô hình.\u003c/p>\n\u003cp>Về kỹ thuật, hệ thống áp dụng mã hóa dữ liệu khi lưu trữ và khi truyền tải, phân quyền truy cập theo vai trò cho từng nhóm người dùng (quản trị, doanh nghiệp, người vận hành), và sao lưu dữ liệu định kỳ. Thiết kế hệ thống bám theo yêu cầu của Luật Bảo vệ dữ liệu cá nhân 2025 (có hiệu lực từ 01/01/2026) và Nghị định 356/2025/NĐ-CP, bao gồm việc thông báo rõ mục đích thu thập dữ liệu và cho phép người dùng yêu cầu xóa dữ liệu cá nhân khi cần.\u003c/p>"},{"id":"11.2","sec":"11","q":"Hệ thống thu thập những dữ liệu cá nhân nào và lưu giữ trong bao lâu?","topics":["ca-nhan"],"t":"Hệ thống áp dụng nguyên tắc tối thiểu hóa dữ liệu:\n• Chỉ thu thập thông tin cần cho cá nhân hóa do người dùng tự nguyện cung cấp (sở thích, ngân sách, thời gian lưu trú, nhóm khách, mục đích chuyến đi), trong đó độ tuổi chỉ ghi theo nhóm tuổi; không yêu cầu họ tên, số định danh hay giấy tờ tùy thân trong luồng hội thoại.\n• Nhật ký tương tác và phản hồi chỉ phục vụ cải thiện chất lượng và tính KPI, được ẩn danh hóa trước khi phân tích; báo cáo trên bảng điều khiển ở dạng tổng hợp.\n• Dữ liệu gắn với danh tính chỉ lưu trong thời hạn cần thiết cho mục đích đã thông báo, sau đó xóa hoặc ẩn danh hóa. Riêng nhật ký hệ thống được lưu theo thời hạn pháp luật yêu cầu (tối thiểu 12 tháng theo Nghị định 333/2026/NĐ-CP).\n• Hệ thống không chủ đích thu thập dữ liệu của trẻ em; nếu phát sinh, áp dụng quy định riêng về dữ liệu trẻ em.","a":"\u003cp>Hệ thống áp dụng nguyên tắc tối thiểu hóa dữ liệu:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Chỉ thu thập thông tin cần cho cá nhân hóa do người dùng tự nguyện cung cấp (sở thích, ngân sách, thời gian lưu trú, nhóm khách, mục đích chuyến đi), trong đó độ tuổi chỉ ghi theo nhóm tuổi; không yêu cầu họ tên, số định danh hay giấy tờ tùy thân trong luồng hội thoại.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Nhật ký tương tác và phản hồi chỉ phục vụ cải thiện chất lượng và tính KPI, được ẩn danh hóa trước khi phân tích; báo cáo trên bảng điều khiển ở dạng tổng hợp.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Dữ liệu gắn với danh tính chỉ lưu trong thời hạn cần thiết cho mục đích đã thông báo, sau đó xóa hoặc ẩn danh hóa. Riêng nhật ký hệ thống được lưu theo thời hạn pháp luật yêu cầu (tối thiểu 12 tháng theo Nghị định 333/2026/NĐ-CP).\u003c/p>\u003c/li>\n\u003cli>\u003cp>Hệ thống không chủ đích thu thập dữ liệu của trẻ em; nếu phát sinh, áp dụng quy định riêng về dữ liệu trẻ em.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"11.3","sec":"11","q":"Người dùng có những quyền gì đối với dữ liệu cá nhân của mình?","topics":["ca-nhan","phap-ly"],"t":"Người dùng được thông báo rõ mục đích, phạm vi và thời hạn xử lý dữ liệu trước khi thu thập; đồng ý riêng cho từng mục đích (cá nhân hóa, vị trí, phân tích) và có thể rút lại đồng ý bất cứ lúc nào; được xem, chỉnh sửa và yêu cầu xóa dữ liệu của mình thông qua chức năng trong ứng dụng hoặc đầu mối tiếp nhận yêu cầu do đơn vị vận hành công bố. Các quyền này được thiết kế theo quy định của Luật Bảo vệ dữ liệu cá nhân 2025.","a":"\u003cp>Người dùng được thông báo rõ mục đích, phạm vi và thời hạn xử lý dữ liệu trước khi thu thập; đồng ý riêng cho từng mục đích (cá nhân hóa, vị trí, phân tích) và có thể rút lại đồng ý bất cứ lúc nào; được xem, chỉnh sửa và yêu cầu xóa dữ liệu của mình thông qua chức năng trong ứng dụng hoặc đầu mối tiếp nhận yêu cầu do đơn vị vận hành công bố. Các quyền này được thiết kế theo quy định của Luật Bảo vệ dữ liệu cá nhân 2025.\u003c/p>"},{"id":"11.4","sec":"11","q":"Dữ liệu vị trí của du khách (bản đồ thông minh) được xử lý như thế nào?","topics":["ca-nhan"],"t":"Dữ liệu vị trí là loại dữ liệu cá nhân được Luật Bảo vệ dữ liệu cá nhân 2025 quy định bảo vệ riêng, nên chỉ được sử dụng khi người dùng cấp quyền trên thiết bị. Vị trí chỉ được dùng tức thời để truy vấn bản đồ và gợi ý điểm đến lân cận (Azure Maps), không đưa vào câu lệnh gửi tới mô hình ngôn ngữ và không lưu thành lịch sử di chuyển gắn với danh tính.","a":"\u003cp>Dữ liệu vị trí là loại dữ liệu cá nhân được Luật Bảo vệ dữ liệu cá nhân 2025 quy định bảo vệ riêng, nên chỉ được sử dụng khi người dùng cấp quyền trên thiết bị. Vị trí chỉ được dùng tức thời để truy vấn bản đồ và gợi ý điểm đến lân cận (Azure Maps), không đưa vào câu lệnh gửi tới mô hình ngôn ngữ và không lưu thành lịch sử di chuyển gắn với danh tính.\u003c/p>"},{"id":"11.5","sec":"11","q":"Dữ liệu cá nhân có được chuyển ra nước ngoài không? Quy định về lưu trữ dữ liệu trong nước được đáp ứng như thế nào?","topics":["ca-nhan","phap-ly"],"t":"Nhóm xử lý theo bốn nguyên tắc:\n• Hạn chế dữ liệu rời Việt Nam: chỉ câu hỏi đã loại bỏ thông tin định danh và các đoạn dữ liệu du lịch công khai được gửi tới API mô hình ở nước ngoài (OpenAI, Anthropic); không gửi dữ liệu tài khoản, lịch sử gắn danh tính, thông tin liên hệ hay vị trí chính xác.\n• Tuân thủ thủ tục: trường hợp phát sinh chuyển dữ liệu cá nhân ra nước ngoài, nhóm cùng đơn vị tiếp nhận lập hồ sơ đánh giá tác động chuyển dữ liệu cá nhân xuyên biên giới theo Luật Bảo vệ dữ liệu cá nhân 2025 và Nghị định 356/2025/NĐ-CP, đồng thời ký thỏa thuận xử lý dữ liệu (DPA) với nhà cung cấp.\n• Lưu trữ trong nước: theo Luật An ninh mạng 2025 và Nghị định 333/2026/NĐ-CP (Điều 19), thông tin cá nhân của người dùng tại Việt Nam và dữ liệu phát sinh từ việc sử dụng dịch vụ (tên tài khoản, thời gian sử dụng, email, địa chỉ IP, số điện thoại gắn với tài khoản) thuộc nhóm phải lưu trữ tại Việt Nam. Hệ thống được thiết kế dạng mô-đun (container, API) để lớp dữ liệu người dùng có thể đặt tại trung tâm dữ liệu trong nước theo phương án hạ tầng đám mây hoặc kết hợp nêu trong Thuyết minh, trong khi các mô-đun AI và kho truy xuất dữ liệu du lịch công khai giữ trên Azure. Vị trí lưu trữ cụ thể được thống nhất với đơn vị tiếp nhận.\n• Truy cập từ xa của thành viên ở nước ngoài: chỉ làm việc trên môi trường phát triển, thử nghiệm và dữ liệu đã ẩn danh; quyền truy cập môi trường vận hành được cấp theo nguyên tắc tối thiểu và có ghi nhật ký.","a":"\u003cp>Nhóm xử lý theo bốn nguyên tắc:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Hạn chế dữ liệu rời Việt Nam:\u003c/strong> chỉ câu hỏi đã loại bỏ thông tin định danh và các đoạn dữ liệu du lịch công khai được gửi tới API mô hình ở nước ngoài (OpenAI, Anthropic); không gửi dữ liệu tài khoản, lịch sử gắn danh tính, thông tin liên hệ hay vị trí chính xác.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Tuân thủ thủ tục:\u003c/strong> trường hợp phát sinh chuyển dữ liệu cá nhân ra nước ngoài, nhóm cùng đơn vị tiếp nhận lập hồ sơ đánh giá tác động chuyển dữ liệu cá nhân xuyên biên giới theo Luật Bảo vệ dữ liệu cá nhân 2025 và Nghị định 356/2025/NĐ-CP, đồng thời ký thỏa thuận xử lý dữ liệu (DPA) với nhà cung cấp.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Lưu trữ trong nước:\u003c/strong> theo Luật An ninh mạng 2025 và Nghị định 333/2026/NĐ-CP (Điều 19), thông tin cá nhân của người dùng tại Việt Nam và dữ liệu phát sinh từ việc sử dụng dịch vụ (tên tài khoản, thời gian sử dụng, email, địa chỉ IP, số điện thoại gắn với tài khoản) thuộc nhóm phải lưu trữ tại Việt Nam. Hệ thống được thiết kế dạng mô-đun (container, API) để lớp dữ liệu người dùng có thể đặt tại trung tâm dữ liệu trong nước theo phương án hạ tầng đám mây hoặc kết hợp nêu trong Thuyết minh, trong khi các mô-đun AI và kho truy xuất dữ liệu du lịch công khai giữ trên Azure. Vị trí lưu trữ cụ thể được thống nhất với đơn vị tiếp nhận.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Truy cập từ xa của thành viên ở nước ngoài:\u003c/strong> chỉ làm việc trên môi trường phát triển, thử nghiệm và dữ liệu đã ẩn danh; quyền truy cập môi trường vận hành được cấp theo nguyên tắc tối thiểu và có ghi nhật ký.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"11.6","sec":"11","q":"Dữ liệu đầu vào của cơ sở dữ liệu du lịch (bài viết, hình ảnh, video) có chứa dữ liệu cá nhân không?","topics":["ca-nhan","du-lieu"],"t":"Trong quy trình kiểm kê ba bước (mục 6), nhóm rà soát cả yếu tố dữ liệu cá nhân: nội dung có hình ảnh, giọng nói hoặc thông tin của người có thể nhận dạng chỉ được đưa vào hệ thống khi có sự đồng ý hoặc đã được che/làm mờ; không thu thập nội dung riêng tư trên mạng xã hội.\nDữ liệu do doanh nghiệp, đơn vị phối hợp cung cấp được phân loại theo mức độ công khai: chỉ dữ liệu được phép công khai mới đưa vào kho truy xuất phục vụ chatbot; dữ liệu nội bộ chỉ phục vụ nền tảng web trong phạm vi phân quyền.","a":"\u003cp>Trong quy trình kiểm kê ba bước (mục \u003ca class=\"xref\" href=\"#sec-6\" data-sec=\"6\">6\u003c/a>), nhóm rà soát cả yếu tố dữ liệu cá nhân: nội dung có hình ảnh, giọng nói hoặc thông tin của người có thể nhận dạng chỉ được đưa vào hệ thống khi có sự đồng ý hoặc đã được che/làm mờ; không thu thập nội dung riêng tư trên mạng xã hội.\u003c/p>\n\u003cp>Dữ liệu do doanh nghiệp, đơn vị phối hợp cung cấp được phân loại theo mức độ công khai: chỉ dữ liệu được phép công khai mới đưa vào kho truy xuất phục vụ chatbot; dữ liệu nội bộ chỉ phục vụ nền tảng web trong phạm vi phân quyền.\u003c/p>"},{"id":"11.7","sec":"11","q":"Ai chịu trách nhiệm bảo vệ dữ liệu cá nhân? Có đánh giá tác động trước khi vận hành không?","topics":["ca-nhan","phap-ly"],"t":"Trong thời gian thực hiện đề tài, nhóm chỉ định thành viên phụ trách kỹ thuật dữ liệu làm đầu mối bảo vệ dữ liệu cá nhân; đơn vị tiếp nhận chỉ định nhân sự hoặc bộ phận bảo vệ dữ liệu cá nhân theo quy định của Luật và Nghị định 356/2025/NĐ-CP. Hồ sơ đánh giá tác động xử lý dữ liệu cá nhân được lập trước khi thử nghiệm với người dùng thật (Bước 6 của thiết kế nghiên cứu) và cập nhật khi hệ thống thay đổi.","a":"\u003cp>Trong thời gian thực hiện đề tài, nhóm chỉ định thành viên phụ trách kỹ thuật dữ liệu làm đầu mối bảo vệ dữ liệu cá nhân; đơn vị tiếp nhận chỉ định nhân sự hoặc bộ phận bảo vệ dữ liệu cá nhân theo quy định của Luật và Nghị định 356/2025/NĐ-CP. Hồ sơ đánh giá tác động xử lý dữ liệu cá nhân được lập trước khi thử nghiệm với người dùng thật (Bước 6 của thiết kế nghiên cứu) và cập nhật khi hệ thống thay đổi.\u003c/p>"},{"id":"12.1","sec":"12","q":"Việc sử dụng API mô hình ngôn ngữ lớn thương mại (OpenAI, Anthropic) có nguy cơ gì về bảo mật và quyền riêng tư? Dữ liệu gửi đi có bị dùng để huấn luyện mô hình không?","topics":["bao-mat","ca-nhan"],"t":"Các rủi ro chính gồm lộ dữ liệu cá nhân qua câu lệnh gửi đi, nhà cung cấp lưu giữ hoặc sử dụng dữ liệu ngoài mục đích dịch vụ, và phụ thuộc vào bên thứ ba. Nhóm xử lý như sau:\n• Chỉ dùng API dành cho tổ chức theo điều khoản thương mại: theo chính sách hiện hành của cả hai nhà cung cấp, dữ liệu gửi qua API không được dùng để huấn luyện mô hình theo mặc định; dữ liệu chỉ được lưu giữ có thời hạn (tối đa khoảng 30 ngày) để vận hành dịch vụ và phát hiện lạm dụng, và có thể đề nghị chế độ không lưu giữ (zero data retention) đối với tài khoản và mô hình đủ điều kiện.\n• Ký thỏa thuận xử lý dữ liệu (DPA), rà soát điều khoản trước khi triển khai và khi nhà cung cấp thay đổi chính sách (xem mục 4).\n• Giảm thiểu dữ liệu gửi đi bằng tiền xử lý và ẩn danh hóa (xem câu hỏi tiếp theo).\n• Có phương án thay thế: kiến trúc cho phép chuyển sang hoặc bổ sung mô hình mở triển khai trên hạ tầng do nhóm hoặc đơn vị tiếp nhận kiểm soát.","a":"\u003cp>Các rủi ro chính gồm lộ dữ liệu cá nhân qua câu lệnh gửi đi, nhà cung cấp lưu giữ hoặc sử dụng dữ liệu ngoài mục đích dịch vụ, và phụ thuộc vào bên thứ ba. Nhóm xử lý như sau:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Chỉ dùng API dành cho tổ chức theo điều khoản thương mại: theo chính sách hiện hành của cả hai nhà cung cấp, dữ liệu gửi qua API không được dùng để huấn luyện mô hình theo mặc định; dữ liệu chỉ được lưu giữ có thời hạn (tối đa khoảng 30 ngày) để vận hành dịch vụ và phát hiện lạm dụng, và có thể đề nghị chế độ không lưu giữ (zero data retention) đối với tài khoản và mô hình đủ điều kiện.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Ký thỏa thuận xử lý dữ liệu (DPA), rà soát điều khoản trước khi triển khai và khi nhà cung cấp thay đổi chính sách (xem mục \u003ca class=\"xref\" href=\"#sec-4\" data-sec=\"4\">4\u003c/a>).\u003c/p>\u003c/li>\n\u003cli>\u003cp>Giảm thiểu dữ liệu gửi đi bằng tiền xử lý và ẩn danh hóa (xem câu hỏi tiếp theo).\u003c/p>\u003c/li>\n\u003cli>\u003cp>Có phương án thay thế: kiến trúc cho phép chuyển sang hoặc bổ sung mô hình mở triển khai trên hạ tầng do nhóm hoặc đơn vị tiếp nhận kiểm soát.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"12.2","sec":"12","q":"Hệ thống ngăn thông tin cá nhân hoặc thông tin nhạy cảm lọt vào câu lệnh gửi tới mô hình như thế nào?","topics":["bao-mat","ca-nhan"],"t":"Mọi lời gọi tới mô hình đều đi qua một lớp trung gian do hệ thống kiểm soát, không gọi trực tiếp từ ứng dụng:\n• Phát hiện và che các mẫu thông tin định danh trong câu hỏi (số điện thoại, email, số giấy tờ, số thẻ) trước khi gửi.\n• Ngữ cảnh gửi kèm chỉ gồm các đoạn dữ liệu du lịch công khai đã truy xuất và kiểm duyệt; không kèm dữ liệu tài khoản, lịch sử gắn danh tính hay vị trí chính xác.\n• Khóa API của nhà cung cấp chỉ nằm ở máy chủ, không nhúng trong ứng dụng điện thoại hay trình duyệt.\n• Giao diện nhắc người dùng không nhập thông tin cá nhân nhạy cảm vào khung trò chuyện.","a":"\u003cp>Mọi lời gọi tới mô hình đều đi qua một lớp trung gian do hệ thống kiểm soát, không gọi trực tiếp từ ứng dụng:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Phát hiện và che các mẫu thông tin định danh trong câu hỏi (số điện thoại, email, số giấy tờ, số thẻ) trước khi gửi.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Ngữ cảnh gửi kèm chỉ gồm các đoạn dữ liệu du lịch công khai đã truy xuất và kiểm duyệt; không kèm dữ liệu tài khoản, lịch sử gắn danh tính hay vị trí chính xác.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Khóa API của nhà cung cấp chỉ nằm ở máy chủ, không nhúng trong ứng dụng điện thoại hay trình duyệt.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Giao diện nhắc người dùng không nhập thông tin cá nhân nhạy cảm vào khung trò chuyện.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"12.3","sec":"12","q":"Hệ thống phòng chống các hình thức tấn công vào mô hình ngôn ngữ như thế nào (tiêm lệnh, vượt rào, lộ lệnh hệ thống)?","topics":["bao-mat"],"t":"Nhóm tham chiếu danh mục rủi ro OWASP Top 10 cho ứng dụng LLM và áp dụng các biện pháp:\n• Chống tiêm lệnh và vượt rào: tách chỉ dẫn hệ thống khỏi nội dung người dùng và nội dung truy xuất (dữ liệu truy xuất được coi là dữ liệu, không phải chỉ dẫn); kiểm tra đầu vào; bộ lọc an toàn đối với đầu ra.\n• Hạn chế quyền của mô hình: chatbot chỉ đọc dữ liệu du lịch công khai thông qua API có kiểm soát; không có quyền truy cập trực tiếp cơ sở dữ liệu người dùng, không có quyền ghi, xóa hay thực hiện giao dịch.\n• Không chứa bí mật trong câu lệnh: không đưa mật khẩu, khóa truy cập hay thông tin nội bộ vào câu lệnh hệ thống, để nếu câu lệnh bị lộ cũng không phát sinh hậu quả.\n• Xử lý an toàn đầu ra: coi đầu ra của mô hình là không đáng tin cậy; làm sạch trước khi hiển thị trên web và ứng dụng để tránh chèn mã độc.\n• Bảo vệ kho dữ liệu truy xuất: chỉ cập nhật qua quy trình kiểm duyệt, phân quyền và lưu vết chỉnh sửa; gắn nguồn gốc cho từng đoạn dữ liệu để chống đầu độc dữ liệu.\n• Kiểm thử đối kháng: dùng bộ câu hỏi tấn công (red-teaming) trước khi vận hành thử nghiệm và chạy lại khi thay đổi mô hình hoặc câu lệnh hệ thống.","a":"\u003cp>Nhóm tham chiếu danh mục rủi ro OWASP Top 10 cho ứng dụng LLM và áp dụng các biện pháp:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Chống tiêm lệnh và vượt rào:\u003c/strong> tách chỉ dẫn hệ thống khỏi nội dung người dùng và nội dung truy xuất (dữ liệu truy xuất được coi là dữ liệu, không phải chỉ dẫn); kiểm tra đầu vào; bộ lọc an toàn đối với đầu ra.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Hạn chế quyền của mô hình:\u003c/strong> chatbot chỉ đọc dữ liệu du lịch công khai thông qua API có kiểm soát; không có quyền truy cập trực tiếp cơ sở dữ liệu người dùng, không có quyền ghi, xóa hay thực hiện giao dịch.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Không chứa bí mật trong câu lệnh:\u003c/strong> không đưa mật khẩu, khóa truy cập hay thông tin nội bộ vào câu lệnh hệ thống, để nếu câu lệnh bị lộ cũng không phát sinh hậu quả.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Xử lý an toàn đầu ra:\u003c/strong> coi đầu ra của mô hình là không đáng tin cậy; làm sạch trước khi hiển thị trên web và ứng dụng để tránh chèn mã độc.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Bảo vệ kho dữ liệu truy xuất:\u003c/strong> chỉ cập nhật qua quy trình kiểm duyệt, phân quyền và lưu vết chỉnh sửa; gắn nguồn gốc cho từng đoạn dữ liệu để chống đầu độc dữ liệu.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Kiểm thử đối kháng:\u003c/strong> dùng bộ câu hỏi tấn công (red-teaming) trước khi vận hành thử nghiệm và chạy lại khi thay đổi mô hình hoặc câu lệnh hệ thống.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"12.4","sec":"12","q":"Làm thế nào ngăn chatbot bị lạm dụng gây phát sinh chi phí hoặc gián đoạn dịch vụ?","topics":["bao-mat","kinh-phi"],"t":"Hệ thống giới hạn tần suất truy vấn theo người dùng/thiết bị, đặt hạn mức sử dụng và cảnh báo khi vượt ngưỡng; dùng cơ chế lưu đệm (cache) cho câu trả lời phổ biến; từ chối các yêu cầu ngoài phạm vi du lịch; có phương án chuyển sang nhà cung cấp dự phòng khi một nhà cung cấp gián đoạn (mục 4). Các biện pháp này cũng là phương án kiểm soát chi phí vận hành nêu trong Thuyết minh.","a":"\u003cp>Hệ thống giới hạn tần suất truy vấn theo người dùng/thiết bị, đặt hạn mức sử dụng và cảnh báo khi vượt ngưỡng; dùng cơ chế lưu đệm (cache) cho câu trả lời phổ biến; từ chối các yêu cầu ngoài phạm vi du lịch; có phương án chuyển sang nhà cung cấp dự phòng khi một nhà cung cấp gián đoạn (mục \u003ca class=\"xref\" href=\"#sec-4\" data-sec=\"4\">4\u003c/a>). Các biện pháp này cũng là phương án kiểm soát chi phí vận hành nêu trong Thuyết minh.\u003c/p>"},{"id":"12.5","sec":"12","q":"Hệ thống kiểm soát thế nào việc chatbot và công cụ tạo nội dung bị dùng để tạo nội dung độc hại, thiên lệch hoặc vi phạm pháp luật?","topics":["chat-luong","phap-ly"],"t":"Bộ lọc an toàn nội dung kiểm tra cả đầu vào và đầu ra; áp dụng danh mục nội dung hạn chế và nguyên tắc biên tập do chuyên gia văn hóa - du lịch thẩm định; nội dung marketing không đăng tải tự động mà phải qua kiểm duyệt của biên tập viên/chuyên gia (mục 8). Cách làm này phù hợp các hành vi bị nghiêm cấm theo Luật Trí tuệ nhân tạo 2025, như lợi dụng AI để lừa dối, xâm phạm quyền riêng tư hoặc sử dụng dữ liệu trái pháp luật.","a":"\u003cp>Bộ lọc an toàn nội dung kiểm tra cả đầu vào và đầu ra; áp dụng danh mục nội dung hạn chế và nguyên tắc biên tập do chuyên gia văn hóa - du lịch thẩm định; nội dung marketing không đăng tải tự động mà phải qua kiểm duyệt của biên tập viên/chuyên gia (mục \u003ca class=\"xref\" href=\"#sec-8\" data-sec=\"8\">8\u003c/a>). Cách làm này phù hợp các hành vi bị nghiêm cấm theo Luật Trí tuệ nhân tạo 2025, như lợi dụng AI để lừa dối, xâm phạm quyền riêng tư hoặc sử dụng dữ liệu trái pháp luật.\u003c/p>"},{"id":"12.6","sec":"12","q":"Hệ thống đáp ứng yêu cầu minh bạch và gắn nhãn nội dung do AI tạo ra theo Luật Trí tuệ nhân tạo 2025 như thế nào?","topics":["phap-ly"],"t":"Ứng dụng và nền tảng thông báo rõ để người dùng biết đang tương tác với hệ thống AI. Nội dung do AI hỗ trợ tạo ra (bài viết, hình minh họa, storyboard) được gắn nhãn nhận biết khi xuất bản theo hướng dẫn của Luật. Phạm vi kỹ thuật của đề tài không cam kết tạo video hoàn chỉnh (mục 2) và nhóm không dùng công cụ để mô phỏng ngoại hình, giọng nói của người thật hay tái hiện sự kiện có thật, nên rủi ro gây nhầm lẫn về tính xác thực được hạn chế. Nhóm sẽ tự đánh giá mức độ rủi ro của hệ thống theo Luật và lập hồ sơ phân loại nếu thuộc nhóm trung bình hoặc cao.","a":"\u003cp>Ứng dụng và nền tảng thông báo rõ để người dùng biết đang tương tác với hệ thống AI. Nội dung do AI hỗ trợ tạo ra (bài viết, hình minh họa, storyboard) được gắn nhãn nhận biết khi xuất bản theo hướng dẫn của Luật. Phạm vi kỹ thuật của đề tài không cam kết tạo video hoàn chỉnh (mục \u003ca class=\"xref\" href=\"#sec-2\" data-sec=\"2\">2\u003c/a>) và nhóm không dùng công cụ để mô phỏng ngoại hình, giọng nói của người thật hay tái hiện sự kiện có thật, nên rủi ro gây nhầm lẫn về tính xác thực được hạn chế. Nhóm sẽ tự đánh giá mức độ rủi ro của hệ thống theo Luật và lập hồ sơ phân loại nếu thuộc nhóm trung bình hoặc cao.\u003c/p>"},{"id":"12.7","sec":"12","q":"Vì sao đề tài chọn mô hình thương mại thay vì tự triển khai mô hình mã nguồn mở để kiểm soát dữ liệu tốt hơn?","topics":["cong-nghe","ca-nhan"],"t":"Giai đoạn đầu dùng mô hình thương mại để bảo đảm chất lượng hội thoại đa ngôn ngữ (Việt, Anh, Trung, Nhật) và tiến độ trong 24 tháng; rủi ro về dữ liệu được kiểm soát bằng cách chỉ gửi dữ liệu công khai và câu hỏi đã ẩn danh. Hệ thống được thiết kế để thay thế hoặc bổ sung mô hình mở (mục 4); ở giai đoạn sau, nhóm chưng cất dữ liệu để hiệu chỉnh các mô hình nhỏ hơn có thể triển khai trên hạ tầng do đơn vị tiếp nhận kiểm soát, dùng cho các tác vụ hoặc dữ liệu cần giữ trong nước.","a":"\u003cp>Giai đoạn đầu dùng mô hình thương mại để bảo đảm chất lượng hội thoại đa ngôn ngữ (Việt, Anh, Trung, Nhật) và tiến độ trong 24 tháng; rủi ro về dữ liệu được kiểm soát bằng cách chỉ gửi dữ liệu công khai và câu hỏi đã ẩn danh. Hệ thống được thiết kế để thay thế hoặc bổ sung mô hình mở (mục \u003ca class=\"xref\" href=\"#sec-4\" data-sec=\"4\">4\u003c/a>); ở giai đoạn sau, nhóm chưng cất dữ liệu để hiệu chỉnh các mô hình nhỏ hơn có thể triển khai trên hạ tầng do đơn vị tiếp nhận kiểm soát, dùng cho các tác vụ hoặc dữ liệu cần giữ trong nước.\u003c/p>"},{"id":"13.1","sec":"13","q":"Hạ tầng đám mây dự kiến sử dụng là gì? Ước tính chi phí vận hành 300-400 triệu đồng/năm dựa trên cơ sở nào.","topics":["kinh-phi","cong-nghe"],"t":"Hệ thống dự kiến triển khai trên Microsoft Azure, kết hợp OpenAI API và Anthropic API. Tổng kinh phí hạ tầng và dịch vụ AI trong 24 tháng là 780 triệu đồng, tương đương khoảng 390 triệu đồng/năm, gồm:\n• Máy chủ ứng dụng Azure App Service/Container Apps: 90 triệu đồng;\n• Cơ sở dữ liệu Azure SQL: 54 triệu đồng;\n• Lưu trữ Azure Blob Storage: 42 triệu đồng;\n• Tìm kiếm ngữ nghĩa Azure AI Search: 60 triệu đồng;\n• Azure AI Services: 42 triệu đồng;\n• Bản đồ Azure Maps: 30 triệu đồng;\n• Giám sát và bảo mật: 30 triệu đồng;\n• Quản lý API: 42 triệu đồng;\n• Kiểm thử tải: 48 triệu đồng;\n• Azure DevOps: 42 triệu đồng;\n• OpenAI API và Anthropic API: 300 triệu đồng (khoảng 12.000 USD; cơ sở ước tính số lượt gọi nêu tại mục 4).\nĐể tối ưu chi phí, hệ thống sử dụng Azure App Service có khả năng mở rộng theo chiều ngang và cơ chế lưu đệm (cache) cho các câu trả lời phổ biến nhằm kiểm soát chi phí khi số lượng người dùng tăng.","a":"\u003cp>Hệ thống dự kiến triển khai trên Microsoft Azure, kết hợp OpenAI API và Anthropic API. Tổng kinh phí hạ tầng và dịch vụ AI trong 24 tháng là 780 triệu đồng, tương đương khoảng 390 triệu đồng/năm, gồm:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Máy chủ ứng dụng Azure App Service/Container Apps: 90 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Cơ sở dữ liệu Azure SQL: 54 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Lưu trữ Azure Blob Storage: 42 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Tìm kiếm ngữ nghĩa Azure AI Search: 60 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Azure AI Services: 42 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bản đồ Azure Maps: 30 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Giám sát và bảo mật: 30 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Quản lý API: 42 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Kiểm thử tải: 48 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>Azure DevOps: 42 triệu đồng;\u003c/p>\u003c/li>\n\u003cli>\u003cp>OpenAI API và Anthropic API: 300 triệu đồng (khoảng 12.000 USD; cơ sở ước tính số lượt gọi nêu tại mục \u003ca class=\"xref\" href=\"#sec-4\" data-sec=\"4\">4\u003c/a>).\u003c/p>\u003c/li>\n\u003c/ul>\n\u003cp>Để tối ưu chi phí, hệ thống sử dụng Azure App Service có khả năng mở rộng theo chiều ngang và cơ chế lưu đệm (cache) cho các câu trả lời phổ biến nhằm kiểm soát chi phí khi số lượng người dùng tăng.\u003c/p>"},{"id":"13.2","sec":"13","q":"Đơn vị nào sẽ chi trả sau khi đề tài kết thúc?","topics":["kinh-phi","van-hanh"],"t":"Về nguồn kinh phí duy trì sau nghiệm thu, nhóm đề xuất Sở Văn hóa, Thể thao và Du lịch bố trí trong kế hoạch chuyển đổi số hằng năm của Sở, đồng thời có thể cân nhắc thu một phần chi phí từ doanh nghiệp sử dụng các mô-đun nâng cao (theo phương án thương mại hóa đã nêu trong Thuyết minh) để giảm gánh nặng ngân sách nhà nước về lâu dài.","a":"\u003cp>Về nguồn kinh phí duy trì sau nghiệm thu, nhóm đề xuất Sở Văn hóa, Thể thao và Du lịch bố trí trong kế hoạch chuyển đổi số hằng năm của Sở, đồng thời có thể cân nhắc thu một phần chi phí từ doanh nghiệp sử dụng các mô-đun nâng cao (theo phương án thương mại hóa đã nêu trong Thuyết minh) để giảm gánh nặng ngân sách nhà nước về lâu dài.\u003c/p>"},{"id":"13.3","sec":"13","q":"Đổi lại tỉnh nhận được gì?","topics":["pham-vi","kinh-phi"],"t":"Một bộ hạ tầng số dùng lâu dài: ứng dụng di động, nền tảng web, cơ sở dữ liệu du lịch, mô hình AI, mã nguồn, tài liệu kỹ thuật và đào tạo chuyển giao — cùng các chỉ tiêu đo được (giảm 50% thời gian sản xuất nội dung, tăng 20% hiệu quả quảng bá).","a":"\u003cp>Một bộ hạ tầng số dùng lâu dài: ứng dụng di động, nền tảng web, cơ sở dữ liệu du lịch, mô hình AI, mã nguồn, tài liệu kỹ thuật và đào tạo chuyển giao — cùng các chỉ tiêu đo được (giảm 50% thời gian sản xuất nội dung, tăng 20% hiệu quả quảng bá).\u003c/p>"},{"id":"14.1","sec":"14","q":"Du khách thường ngại cài thêm ứng dụng; làm sao để họ biết đến và sử dụng ứng dụng?","topics":["van-hanh"],"t":"Ứng dụng được giới thiệu qua nhiều kênh: liên kết từ Cổng Du lịch thông minh Gia Lai (mục 3); mã QR tại cơ sở lưu trú, điểm đến và sự kiện, bắt đầu từ các đơn vị phối hợp (Nhà khách Quy Nhơn – Binh đoàn 15, Khách sạn Hải Âu); kênh truyền thông của Sở và doanh nghiệp; liên kết với ứng dụng của doanh nghiệp địa phương (mục 13.4 Thuyết minh). Số người dùng và lượt tương tác được theo dõi trên bảng điều khiển; nếu tỷ lệ sử dụng thấp, nhóm điều chỉnh theo quy trình ở mục 16.","a":"\u003cp>Ứng dụng được giới thiệu qua nhiều kênh: liên kết từ Cổng Du lịch thông minh Gia Lai (mục \u003ca class=\"xref\" href=\"#sec-3\" data-sec=\"3\">3\u003c/a>); mã QR tại cơ sở lưu trú, điểm đến và sự kiện, bắt đầu từ các đơn vị phối hợp (Nhà khách Quy Nhơn – Binh đoàn 15, Khách sạn Hải Âu); kênh truyền thông của Sở và doanh nghiệp; liên kết với ứng dụng của doanh nghiệp địa phương (mục 13.4 Thuyết minh). Số người dùng và lượt tương tác được theo dõi trên bảng điều khiển; nếu tỷ lệ sử dụng thấp, nhóm điều chỉnh theo quy trình ở mục \u003ca class=\"xref\" href=\"#sec-16\" data-sec=\"16\">16\u003c/a>.\u003c/p>"},{"id":"14.2","sec":"14","q":"Sở chưa có đội ngũ AI chuyên trách; sau nghiệm thu ai vận hành, cập nhật dữ liệu và mô hình?","topics":["van-hanh"],"t":"Theo phương thức chuyển giao trong Thuyết minh (mục 13.2), việc vận hành chia ba phần: (i) Sở Văn hóa, Thể thao và Du lịch là đầu mối quản lý, cung cấp thông tin mới theo định kỳ; (ii) doanh nghiệp được phân quyền tự cập nhật dữ liệu dịch vụ; (iii) đơn vị kỹ thuật chuyên môn phối hợp bảo trì, cập nhật mô hình AI theo chu kỳ và giám sát an toàn. Việc cập nhật dữ liệu thực hiện qua giao diện quản trị, không đòi hỏi chuyên môn AI. Đề tài bàn giao mã nguồn, tài liệu vận hành, khóa học trực tuyến, đào tạo cán bộ và hỗ trợ kỹ thuật sau nghiệm thu.","a":"\u003cp>Theo phương thức chuyển giao trong Thuyết minh (mục 13.2), việc vận hành chia ba phần: (i) Sở Văn hóa, Thể thao và Du lịch là đầu mối quản lý, cung cấp thông tin mới theo định kỳ; (ii) doanh nghiệp được phân quyền tự cập nhật dữ liệu dịch vụ; (iii) đơn vị kỹ thuật chuyên môn phối hợp bảo trì, cập nhật mô hình AI theo chu kỳ và giám sát an toàn. Việc cập nhật dữ liệu thực hiện qua giao diện quản trị, không đòi hỏi chuyên môn AI. Đề tài bàn giao mã nguồn, tài liệu vận hành, khóa học trực tuyến, đào tạo cán bộ và hỗ trợ kỹ thuật sau nghiệm thu.\u003c/p>"},{"id":"14.3","sec":"14","q":"Kết quả của đề tài (mã nguồn, cơ sở dữ liệu, mô hình) thuộc sở hữu của ai? Lợi nhuận khi thương mại hóa được phân chia thế nào?","topics":["van-hanh","phap-ly"],"t":"Theo Luật Khoa học, công nghệ và đổi mới sáng tạo 2025, quyền quản lý, sử dụng, sở hữu kết quả nhiệm vụ sử dụng ngân sách nhà nước được giao cho tổ chức chủ trì tương ứng với tỷ lệ kinh phí ngân sách, không phải bồi hoàn, trừ các trường hợp Nhà nước giữ quyền theo quy định. Với kinh phí 100% ngân sách, Trường Đại học Quy Nhơn với vai trò tổ chức chủ trì dự kiến được giao quyền và chuyển giao quyền sử dụng hệ thống, mã nguồn, cơ sở dữ liệu cho Sở Văn hóa, Thể thao và Du lịch để vận hành phục vụ nhiệm vụ công.\nKhi thương mại hóa (mục 13.4 Thuyết minh), tối thiểu 30% lợi nhuận được dành thưởng cho tác giả theo Luật. Dữ liệu do doanh nghiệp, đơn vị phối hợp cung cấp được sử dụng theo thỏa thuận với bên cung cấp. Việc chuyển giao kết quả cho tổ chức, cá nhân nước ngoài (nếu có) chịu sự kiểm soát theo quy định của Luật.","a":"\u003cp>Theo Luật Khoa học, công nghệ và đổi mới sáng tạo 2025, quyền quản lý, sử dụng, sở hữu kết quả nhiệm vụ sử dụng ngân sách nhà nước được giao cho tổ chức chủ trì tương ứng với tỷ lệ kinh phí ngân sách, không phải bồi hoàn, trừ các trường hợp Nhà nước giữ quyền theo quy định. Với kinh phí 100% ngân sách, Trường Đại học Quy Nhơn với vai trò tổ chức chủ trì dự kiến được giao quyền và chuyển giao quyền sử dụng hệ thống, mã nguồn, cơ sở dữ liệu cho Sở Văn hóa, Thể thao và Du lịch để vận hành phục vụ nhiệm vụ công.\u003c/p>\n\u003cp>Khi thương mại hóa (mục 13.4 Thuyết minh), tối thiểu 30% lợi nhuận được dành thưởng cho tác giả theo Luật. Dữ liệu do doanh nghiệp, đơn vị phối hợp cung cấp được sử dụng theo thỏa thuận với bên cung cấp. Việc chuyển giao kết quả cho tổ chức, cá nhân nước ngoài (nếu có) chịu sự kiểm soát theo quy định của Luật.\u003c/p>"},{"id":"15.1","sec":"15","q":"Thành viên kỹ thuật lõi ở nước ngoài phối hợp với nhóm thế nào?","topics":["doi-ngu"],"t":"Làm việc từ xa với họp định kỳ hằng tuần/hai tuần, dùng Azure DevOps để quản lý công việc minh bạch, và có kế hoạch về nước vào các mốc quan trọng (thiết kế kiến trúc, đánh giá giữa kỳ, nghiệm thu).","a":"\u003cp>Làm việc từ xa với họp định kỳ hằng tuần/hai tuần, dùng Azure DevOps để quản lý công việc minh bạch, và có kế hoạch về nước vào các mốc quan trọng (thiết kế kiến trúc, đánh giá giữa kỳ, nghiệm thu).\u003c/p>"},{"id":"15.2","sec":"15","q":"Ai bảo đảm tiến độ triển khai thực tế tại địa phương?","topics":["doi-ngu"],"t":"Các thành viên trong nước trực tiếp đảm nhiệm thu thập dữ liệu, phát triển ứng dụng, tích hợp và vận hành thử nghiệm, không phụ thuộc vào sự có mặt thường xuyên của thành viên ở nước ngoài.","a":"\u003cp>Các thành viên trong nước trực tiếp đảm nhiệm thu thập dữ liệu, phát triển ứng dụng, tích hợp và vận hành thử nghiệm, không phụ thuộc vào sự có mặt thường xuyên của thành viên ở nước ngoài.\u003c/p>"},{"id":"15.3","sec":"15","q":"Chủ nhiệm đề tài có chuyên môn kinh tế – kế toán; năng lực chủ trì một đề tài AI được bảo đảm như thế nào?","topics":["doi-ngu"],"t":"Đề tài là nhiệm vụ liên ngành, trọng tâm là ứng dụng AI vào quảng bá và quản lý du lịch, nên vai trò chủ nhiệm là điều phối, quản lý nguồn lực, tiến độ và đánh giá hiệu quả kinh tế – xã hội. PGS.TS. Trần Thị Cẩm Thanh có 28 năm kinh nghiệm phân tích kinh tế và đã chủ nhiệm Đề án xây dựng phần mềm quảng bá du lịch huyện Vân Canh, sản phẩm cùng loại với đề tài.\nPhần công nghệ do các thành viên chuyên sâu đảm nhiệm: ThS. NCS. Nguyễn Trương Thành Hưng (AI tạo sinh, 32 công bố quốc tế, nghiên cứu tại National Research Council Canada), ThS. Nguyễn Võ Thành Khang (07 năm phát triển AI tại FPT Software) và CN. Lâm Hải Sơn (kỹ thuật dữ liệu). Năng lực triển khai của nhóm được chứng minh qua sản phẩm akaCam/QaiDora Vision (Sao Khuê 2023, Gold Stevie® 2025).","a":"\u003cp>Đề tài là nhiệm vụ liên ngành, trọng tâm là ứng dụng AI vào quảng bá và quản lý du lịch, nên vai trò chủ nhiệm là điều phối, quản lý nguồn lực, tiến độ và đánh giá hiệu quả kinh tế – xã hội. PGS.TS. Trần Thị Cẩm Thanh có 28 năm kinh nghiệm phân tích kinh tế và đã chủ nhiệm Đề án xây dựng phần mềm quảng bá du lịch huyện Vân Canh, sản phẩm cùng loại với đề tài.\u003c/p>\n\u003cp>Phần công nghệ do các thành viên chuyên sâu đảm nhiệm: ThS. NCS. Nguyễn Trương Thành Hưng (AI tạo sinh, 32 công bố quốc tế, nghiên cứu tại National Research Council Canada), ThS. Nguyễn Võ Thành Khang (07 năm phát triển AI tại FPT Software) và CN. Lâm Hải Sơn (kỹ thuật dữ liệu). Năng lực triển khai của nhóm được chứng minh qua sản phẩm akaCam/QaiDora Vision (Sao Khuê 2023, Gold Stevie® 2025).\u003c/p>"},{"id":"15.4","sec":"15","q":"Nhóm thực hiện chưa có thành viên chuyên ngành du lịch, văn hóa hoặc ngôn ngữ; ai thẩm định nội dung chuyên môn?","topics":["doi-ngu","chat-luong"],"t":"Nội dung chuyên môn được thẩm định qua ba nguồn: (i) chuyên gia du lịch, văn hóa và ngoại ngữ tham gia theo hình thức thuê chuyên gia [nhóm bổ sung tên, đơn vị]; (ii) Sở Văn hóa, Thể thao và Du lịch và các đơn vị phối hợp, đối chiếu với thông tin chính thống; (iii) phương pháp chuyên gia áp dụng trong Nội dung 1 và Nội dung 3 để thẩm định độ chính xác, tính phù hợp văn hóa và tính đại diện của dữ liệu.","a":"\u003cp>Nội dung chuyên môn được thẩm định qua ba nguồn: (i) chuyên gia du lịch, văn hóa và ngoại ngữ tham gia theo hình thức thuê chuyên gia \u003cmark class=\"todo\">[nhóm bổ sung tên, đơn vị]\u003c/mark>; (ii) Sở Văn hóa, Thể thao và Du lịch và các đơn vị phối hợp, đối chiếu với thông tin chính thống; (iii) phương pháp chuyên gia áp dụng trong Nội dung 1 và Nội dung 3 để thẩm định độ chính xác, tính phù hợp văn hóa và tính đại diện của dữ liệu.\u003c/p>"},{"id":"16.1","sec":"16","q":"Các bước xử lý rủi ro chất lượng AI?","topics":["chat-luong"],"t":"Nếu hệ thống mô tả sai một phong tục hoặc lễ hội, quy trình xử lý gồm: (1) người dùng hoặc cán bộ vận hành gắn cờ nội dung nghi sai; (2) chuyên gia văn hóa - du lịch kiểm tra, đối chiếu với nguồn chính thống và hiệu chỉnh; (3) cập nhật cơ sở dữ liệu và cơ chế truy xuất để ưu tiên nguồn đã xác minh, đồng thời kiểm thử lại câu trả lời trước khi đưa vào sử dụng. Quy trình này giúp giảm lặp lại lỗi và hạn chế hiện tượng AI tạo thông tin không chính xác.","a":"\u003cp>Nếu hệ thống mô tả sai một phong tục hoặc lễ hội, quy trình xử lý gồm: (1) người dùng hoặc cán bộ vận hành gắn cờ nội dung nghi sai; (2) chuyên gia văn hóa - du lịch kiểm tra, đối chiếu với nguồn chính thống và hiệu chỉnh; (3) cập nhật cơ sở dữ liệu và cơ chế truy xuất để ưu tiên nguồn đã xác minh, đồng thời kiểm thử lại câu trả lời trước khi đưa vào sử dụng. Quy trình này giúp giảm lặp lại lỗi và hạn chế hiện tượng AI tạo thông tin không chính xác.\u003c/p>"},{"id":"16.2","sec":"16","q":"Cách tiếp cận này áp dụng cho các rủi ro như thế nào?","topics":["chat-luong","van-hanh"],"t":"Nguyên tắc chung là phát hiện, xác minh với đầu mối chuyên môn, khắc phục và cập nhật hệ thống. Cụ thể:\n• Dữ liệu và bản quyền: phát hiện dữ liệu chưa rõ nguồn → cán bộ pháp lý/chuyên gia dữ liệu xác minh → bổ sung tác quyền, siêu dữ liệu hoặc loại bỏ dữ liệu.\n• Bảo mật và dữ liệu cá nhân: phát hiện truy cập bất thường → bộ phận kỹ thuật xác minh → khóa quyền truy cập, xử lý sự cố, cập nhật phân quyền và biện pháp bảo mật.\n• An toàn khi sử dụng LLM: phát hiện câu lệnh tấn công hoặc đầu ra vi phạm → nhóm kỹ thuật phân tích → cập nhật bộ lọc, quy tắc và kiểm thử lại trước khi áp dụng.\n• Tích hợp hệ thống: phát hiện lỗi kết nối API → nhóm kỹ thuật hai bên kiểm tra → điều chỉnh giao diện kết nối, tài liệu kỹ thuật và kiểm thử lại.\n• Chi phí vận hành: phát hiện mức sử dụng vượt ngưỡng → nhóm vận hành phân tích nguyên nhân → giới hạn tải, tối ưu mô hình, cache dữ liệu và điều chỉnh cấu hình.\n• Tiếp nhận và sử dụng: phát hiện tỷ lệ sử dụng thấp → lấy ý kiến cán bộ, doanh nghiệp và người dùng → cải tiến giao diện, bổ sung hướng dẫn và đào tạo.\n• Tiến độ triển khai: phát hiện công việc chậm so với kế hoạch → chủ nhiệm và nhóm phụ trách xác minh nguyên nhân → điều chỉnh nguồn lực, thứ tự ưu tiên và mốc triển khai.\n• Đạo đức và truyền thông: phát hiện nội dung thiên lệch hoặc thiếu nhạy cảm văn hóa → chuyên gia văn hóa – du lịch thẩm định → chỉnh sửa, bổ sung quy tắc kiểm duyệt và danh mục nội dung hạn chế.","a":"\u003cp>Nguyên tắc chung là phát hiện, xác minh với đầu mối chuyên môn, khắc phục và cập nhật hệ thống. Cụ thể:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Dữ liệu và bản quyền:\u003c/strong> phát hiện dữ liệu chưa rõ nguồn → cán bộ pháp lý/chuyên gia dữ liệu xác minh → bổ sung tác quyền, siêu dữ liệu hoặc loại bỏ dữ liệu.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Bảo mật và dữ liệu cá nhân:\u003c/strong> phát hiện truy cập bất thường → bộ phận kỹ thuật xác minh → khóa quyền truy cập, xử lý sự cố, cập nhật phân quyền và biện pháp bảo mật.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>An toàn khi sử dụng LLM:\u003c/strong> phát hiện câu lệnh tấn công hoặc đầu ra vi phạm → nhóm kỹ thuật phân tích → cập nhật bộ lọc, quy tắc và kiểm thử lại trước khi áp dụng.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Tích hợp hệ thống:\u003c/strong> phát hiện lỗi kết nối API → nhóm kỹ thuật hai bên kiểm tra → điều chỉnh giao diện kết nối, tài liệu kỹ thuật và kiểm thử lại.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Chi phí vận hành:\u003c/strong> phát hiện mức sử dụng vượt ngưỡng → nhóm vận hành phân tích nguyên nhân → giới hạn tải, tối ưu mô hình, cache dữ liệu và điều chỉnh cấu hình.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Tiếp nhận và sử dụng:\u003c/strong> phát hiện tỷ lệ sử dụng thấp → lấy ý kiến cán bộ, doanh nghiệp và người dùng → cải tiến giao diện, bổ sung hướng dẫn và đào tạo.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Tiến độ triển khai:\u00   if (sem.state === 'loading' || sem.state === 'indexing' || sem.state === 'ready') return;
  const run = ++sem.run;
  if (!sem.extractor) setSem('loading');
  try {
    sem.extractor = await getExtractor();
    if (run !== sem.run) return;
    if (!E.hasVectors()) await indexInBrowser(run);
    if (run !== sem.run) return;
    setSem('ready');
    if (state.q.trim()) runSearch();
  } catch (e) {
    console.warn('Semantic search unavailable:', e);
    if (run === sem.run) setSem('error', e && e.message ? e.message.slice(0, 80) : '');
  }
}
// Used only when the page was built without precomputed vectors.
async function indexInBrowser(run) {
  const key = 'bo-cau-hoi.vec.' + MODEL + '.' + DATA.updated + '.' + DATA.items.length;
  const dim = 384, index = DATA.items.map((_, i) => [2 * i, 2]);
  const cached = store.get(key);
  if (cached) { E.setVectors(b64ToInt8(cached), dim, index, null); return; }
  const all = new Int8Array(DATA.items.length * 2 * dim);
  sem.done = 0; setSem('indexing');
  for (let i = 0; i < DATA.items.length; i++) {
    const it = DATA.items[i];
    const out = await sem.extractor(['passage: ' + it.q, 'passage: ' + it.q + '\n' + it.t], { pooling: 'mean', normalize: true });
    for (let r = 0; r < 2; r++) {
      const v = out.data.subarray(r * dim, (r + 1) * dim);
      const max = Math.max(...Array.from(v, Math.abs)) || 1;
      for (let k = 0; k < dim; k++) all[(2 * i + r) * dim + k] = Math.round(v[k] / max * 127);
    }
    if (run !== sem.run) return;
    sem.done = i + 1; setSem('indexing');
  }
  E.setVectors(all, dim, index, null);
  store.set(key, int8ToB64(all));
}
semBtn.addEventListener('click', () => {
  if (sem.state === 'off' || sem.state === 'error') { store.set(PREF, 'on'); startSemantic(); }
  else {
    store.set(PREF, 'off'); sem.run++;
    setSem('off');
    if (state.q.trim()) runSearch();
  }
});

// ---------- events ----------
input.addEventListener('input', onInput);
input.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (input.value) { input.value = ''; onInput(); } else input.blur(); }
  else if (e.key === 'ArrowDown' || e.key === 'Enter') {
    const h = list.querySelector('.qa-h');
    if (h) { e.preventDefault(); h.focus(); if (e.key === 'Enter') h.closest('.qa').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  }
});
$('#clear').addEventListener('click', () => { input.value = ''; onInput(); input.focus(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); input.focus(); input.select(); }
  if (e.key === 'Escape') document.body.classList.remove('toc-open');
});

function toggle(el, force) {
  const set = found ? opened.search : opened.browse, id = el.dataset.id;
  const open = force ?? !set.has(id);
  open ? set.add(id) : set.delete(id);
  el.classList.toggle('open', open);
  el.querySelector('.qa-h').setAttribute('aria-expanded', open);
  const snip = el.querySelector('.snip');
  if (snip) snip.hidden = open;
  if (open) fillAnswer(el); else el.querySelector('.qa-a').innerHTML = '';
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(msg);
}
function goToSection(id) {
  input.value = ''; state.q = ''; found = null; state.filter = null; $('#clear').hidden = true;
  render();
  const h = document.getElementById('sec-' + id);
  if (!h) return;
  h.scrollIntoView({ block: 'start', behavior: 'smooth' });
  h.classList.add('flash'); setTimeout(() => h.classList.remove('flash'), 1200);
}

list.addEventListener('click', e => {
  const xref = e.target.closest('a.xref');
  if (xref) { e.preventDefault(); goToSection(xref.dataset.sec); return; }
  const act = e.target.closest('[data-act]');
  const el = e.target.closest('.qa');
  if (act) {
    const a = act.dataset.act;
    if (a === 'more') { showAll = true; render(); }
    else if (a === 'unfilter') setFilter(null);
    else if (a === 'copy' && el) {
      const it = DATA.items[idx[el.dataset.id]];
      copy(`${it.id}. ${it.q}\n\n${it.t}`, 'Đã sao chép câu trả lời');
    } else if (a === 'link' && el) copy(location.href.split('#')[0] + '#' + slug(el.dataset.id), 'Đã sao chép liên kết');
    return;
  }
  if (e.target.closest('.qa-h') && el) { toggle(el); renderResbar(visibleItems()); }
});
list.addEventListener('keydown', e => {
  const h = e.target.closest('.qa-h');
  if (!h) return;
  const heads = [...list.querySelectorAll('.qa-h')], k = heads.indexOf(h);
  if (e.key === 'ArrowDown' && heads[k + 1]) { e.preventDefault(); heads[k + 1].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (heads[k - 1] || input).focus(); }
  else if (e.key === 'Escape') input.focus();
});
$('#resbar').addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'unfilter') setFilter(null);
  else if (act.dataset.act === 'toc') document.body.classList.add('toc-open');
  else if (act.dataset.act === 'all') {
    const els = [...list.querySelectorAll('.qa')];
    const open = !els.every(el => isOpen(el.dataset.id));
    els.forEach(el => toggle(el, open));
    renderResbar(visibleItems());
  }
});
$('#examples').addEventListener('click', e => {
  const b = e.target.closest('.ex');
  if (b) { input.value = b.textContent; onInput(); input.focus(); }
});
const onFilterClick = e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  const [type, id] = b.dataset.f.split(':');
  setFilter(type ? { type, id } : null);
};
$('#topics').addEventListener('click', onFilterClick);
$('#toc').addEventListener('click', onFilterClick);
$('#scrim').addEventListener('click', () => document.body.classList.remove('toc-open'));

const bar = $('#bar');
const syncBar = () => {
  document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px');
  bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0 && window.scrollY > 0);
};
window.addEventListener('scroll', syncBar, { passive: true });
window.addEventListener('resize', syncBar);
window.addEventListener('beforeprint', () => { printing = true; render(); });
window.addEventListener('afterprint', () => { printing = false; render(); });

function openFromHash() {
  const m = location.hash.match(/^#(q-[\w-]+|sec-[\w]+)$/);
  if (!m) return;
  if (m[1].startsWith('sec-')) { goToSection(m[1].slice(4)); return; }
  const it = DATA.items.find(x => slug(x.id) === m[1]);
  if (!it) return;
  input.value = ''; state.q = ''; found = null; state.filter = null;
  opened.browse.add(it.id);
  render();
  document.getElementById(m[1]).scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', openFromHash);

// ---------- start ----------
if (DATA.emb) E.setVectors(b64ToInt8(DATA.emb.vecs), DATA.emb.dim, DATA.emb.index, DATA.emb.spans);
setSem('off');
render();
syncBar();
openFromHash();
if (store.get(PREF) !== 'off') setTimeout(startSemantic, 400);
})();
</script>
</body>
