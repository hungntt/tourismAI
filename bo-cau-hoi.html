<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ câu hỏi đề tài</title>
<meta name="description" content="Tra cứu nhanh bộ câu hỏi – trả lời của đề tài AI tạo sinh trong quảng bá du lịch tỉnh Gia Lai">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8F9; --surface:#FFFFFF; --surface-2:#EEF3F5; --ink:#14181B; --ink-2:#38424A; --muted:#646C73;
    --line:#E1E7EA; --line-2:#CCD6DB; --accent:#E4572A; --accent-ink:#B5401A; --accent-soft:rgba(228,87,42,.11);
    --mark:rgba(238,98,45,.20); --ok:#16936A; --warn:#A8620E; --scrim:rgba(14,19,22,.36);
    --p1:#D24E1C; --p2:#08809A; --p3:#1F7F59; --p4:#9A6410;
    --hero-a:rgba(228,87,42,.11); --hero-b:rgba(10,147,176,.12);
    --shadow:0 1px 2px rgba(20,30,40,.05),0 4px 16px rgba(20,30,40,.06);
    --shadow-lg:0 2px 6px rgba(20,30,40,.08),0 16px 40px rgba(20,30,40,.14);
    --bar-h:120px; color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.62 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
  button{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  @media (min-width:720px){.wrap{padding:0 28px}}

  .hero{background:radial-gradient(900px 420px at 0% 0%,var(--hero-a),transparent 62%),radial-gradient(800px 420px at 100% 0%,var(--hero-b),transparent 62%);padding:34px 0 14px}
  .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 13px/1.2 Lexend,sans-serif;letter-spacing:.08em;color:var(--muted)}
  .wm{color:var(--ink-2)} .wm em{font-style:normal;color:var(--accent)}
  .eyebrow .sep{opacity:.5}
  .eyebrow .upd{font-weight:500;letter-spacing:.02em}
  h1{font:600 clamp(22px,3.1vw,31px)/1.25 Lexend,sans-serif;letter-spacing:-.015em;margin:12px 0 8px;max-width:900px;text-wrap:balance}
  .stats{margin:0;color:var(--muted);font-size:14px}

  .bar{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
  .bar.stuck{border-bottom-color:var(--line)}
  .search{display:flex;align-items:center;gap:6px;height:54px;padding:0 7px 0 16px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
  .search .ico{flex:none;width:20px;height:20px;color:var(--muted)}
  .search input{flex:1;min-width:0;height:100%;padding:0 4px 0 6px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
  .search input::placeholder{color:var(--muted);opacity:.9}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  .clear{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .clear:hover{background:var(--surface-2);color:var(--ink)}
  .kbd{flex:none;min-width:24px;height:24px;padding:0 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;display:grid;place-items:center;font:500 12px/1 'Be Vietnam Pro',sans-serif;color:var(--muted)}
  .search:focus-within .kbd{display:none}
  .sem{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap}
  .sem:hover{border-color:var(--line-2)}
  .sem-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .sem[data-state="ready"] .sem-dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 24%,transparent)}
  .sem[data-state="loading"] .sem-dot,.sem[data-state="indexing"] .sem-dot{background:transparent;border:2px solid var(--accent);border-right-color:transparent;width:12px;height:12px;animation:spin .8s linear infinite}
  .sem[data-state="error"] .sem-dot{background:var(--warn)}
  .sem-short{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){.kbd{display:none}.sem-long{display:none}.sem-short{display:inline}.sem{padding:0 10px}}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chips::after{content:"";flex:none;width:20px}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--line-2);color:var(--ink)}
  .chip .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;padding-top:14px;padding-bottom:96px}
  @media (min-width:1000px){.layout{grid-template-columns:262px minmax(0,1fr)}}
  main{min-width:0;max-width:820px}

  .toc{position:sticky;top:calc(var(--bar-h) + 6px);align-self:start;max-height:calc(100vh - var(--bar-h) - 12px);overflow:auto;padding:4px 4px 24px 0;scrollbar-width:thin}
  .toc-title{display:none;font:600 17px/1.3 Lexend,sans-serif;margin:0 0 8px}
  .toc button{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;width:100%;padding:7px 10px;border-radius:10px;font-size:14px;line-height:1.38;color:var(--ink-2);cursor:pointer}
  .toc button:hover{background:var(--surface-2);color:var(--ink)}
  .toc button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .toc button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
  .toc .t{flex:1}
  .toc .n{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
  .toc .sn{flex:none;min-width:20px;color:var(--pc);font-weight:600;font-variant-numeric:tabular-nums}
  .toc .part{margin-top:16px;font:600 11.5px/1.35 Lexend,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .toc .part .t{color:var(--ink-2)}
  .toc .part .pn{color:var(--pc)}
  .scrim{display:none}
  @media (max-width:999px){
    .toc{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);max-height:none;z-index:40;padding:20px 14px 32px;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform .22s ease;visibility:hidden}
    body.toc-open .toc{transform:none;visibility:visible}
    .toc-title{display:block;padding:0 10px}
    body.toc-open .scrim{display:block;position:fixed;inset:0;z-index:39;background:var(--scrim)}
  }

  .resbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;min-height:38px;margin-bottom:6px}
  .count{font-size:14px;color:var(--muted)}
  .count b{color:var(--ink);font-weight:600}
  .count q{quotes:"“" "”"}
  .fpill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:500;max-width:100%}
  .fpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fpill button{all:unset;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;cursor:pointer}
  .fpill button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
  .spacer{flex:1}
  .ghost{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .ghost:hover{border-color:var(--line-2);color:var(--ink)}
  .ghost svg{width:16px;height:16px}
  .toc-btn{display:none}
  @media (max-width:999px){.toc-btn{display:inline-flex}}

  .examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 8px}
  .examples .lbl{font-size:13px;color:var(--muted);margin-right:2px}
  .ex{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);font-size:13px;cursor:pointer}
  .ex:hover{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}

  .part-h{margin:30px 0 4px;scroll-margin-top:calc(var(--bar-h) + 12px)}
  .part-h:first-child{margin-top:8px}
  .part-h .pn{font:600 12px/1.2 Lexend,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--pc)}
  .part-h h2{font:600 21px/1.3 Lexend,sans-serif;letter-spacing:-.01em;margin:4px 0 0}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 10px;font:600 15.5px/1.4 Lexend,sans-serif;color:var(--ink);scroll-margin-top:calc(var(--bar-h) + 12px);border-radius:8px;transition:background-color .6s}
  .sec-h .sn{color:var(--pc);font-variant-numeric:tabular-nums}
  .sec-h .n{margin-left:auto;font:400 12.5px/1 'Be Vietnam Pro',sans-serif;color:var(--muted);white-space:nowrap}
  .flash{background:var(--accent-soft)}

  .qa{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;scroll-margin-top:calc(var(--bar-h) + 12px);transition:border-color .15s,box-shadow .15s}
  .qa:hover{border-color:var(--line-2)}
  .qa.open{border-color:var(--line-2);box-shadow:var(--shadow)}
  .qa-h{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:14px;width:100%;padding:15px 16px 15px 16px;border-radius:16px;cursor:pointer}
  .qa-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{flex:none;min-width:46px;height:26px;padding:0 7px;border-radius:8px;display:inline-grid;place-items:center;margin-top:1px;font:600 12.5px/1 Lexend,sans-serif;font-variant-numeric:tabular-nums;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
  .qa-main{flex:1;min-width:0}
  .qa-q{display:block;font-weight:600;font-size:16px;line-height:1.48;color:var(--ink);text-wrap:pretty}
  .qa-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:7px;font-size:12.5px;line-height:1.35;color:var(--muted)}
  .qa-meta .crumb{margin-right:2px}
  .tag{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px}
  .tag.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);font-weight:500}
  .meter{flex:none;width:26px;height:4px;margin-top:12px;border-radius:2px;background:var(--line);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px;background:var(--accent)}
  .chev{flex:none;width:20px;height:20px;margin-top:4px;color:var(--muted);transition:transform .2s}
  .qa.open .chev{transform:rotate(180deg)}
  .snip{margin:-4px 18px 15px 76px;font-size:14px;line-height:1.58;color:var(--ink-2)}
  .qa-a{padding:0 22px 18px 76px}
  .qa-a:empty{display:none}
  @media (max-width:600px){.snip{margin-left:16px}.qa-a{padding-left:16px;padding-right:16px}.qa-h{gap:12px}}

  .prose{color:var(--ink-2)}
  .prose>:first-child{margin-top:0}
  .prose p{margin:0 0 10px}
  .prose ul,.prose ol{margin:4px 0 12px;padding-left:20px}
  .prose li{margin:5px 0;padding-left:2px}
  .prose li p{margin:0}
  .prose li::marker{color:var(--pc)}
  .prose strong{font-weight:600;color:var(--ink)}
  .prose blockquote{margin:6px 0 12px;padding:8px 14px;border-left:3px solid color-mix(in srgb,var(--pc) 60%,transparent);background:var(--surface-2);border-radius:0 10px 10px 0}
  .prose blockquote p{margin:4px 0}
  .tbl{overflow-x:auto;margin:10px 0 14px;border:1px solid var(--line);border-radius:12px}
  .tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;line-height:1.45}
  .tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .tbl thead th{background:var(--surface-2);font-weight:600;color:var(--ink)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl.num-last td:last-child,.tbl.num-last th:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  mark.todo{background:transparent;color:var(--warn);border-bottom:1.5px dashed var(--warn);border-radius:0;padding:0}
  a.xref{color:var(--accent-ink);font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .acts .ghost{height:32px;font-size:12.5px}

  .more{display:flex;justify-content:center;width:100%;margin:14px 0 0;height:42px;border-style:dashed}
  .empty{padding:44px 16px;text-align:center;color:var(--muted)}
  .empty b{display:block;margin-bottom:6px;font:600 17px/1.3 Lexend,sans-serif;color:var(--ink)}
  .empty .ghost{margin-top:14px}

  .toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);transition:opacity .18s,transform .18s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
  @media print{
    body{background:#fff;color:#000;font-size:11pt}
    .bar,.toc,.resbar,.examples,.acts,.chev,.meter,.more,.scrim,.toast{display:none!important}
    .layout{display:block;padding:0}
    .hero{background:none;padding:0 0 8px}
    .qa{break-inside:avoid;border:0;border-top:1px solid #ccc;border-radius:0;box-shadow:none!important}
    .qa-a{padding-left:16px}
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow"><span class="wm">BỘ <em>CÂU HỎI</em></span><span class="sep">·</span><span class="upd" id="upd"></span></div>
    <h1 id="title"></h1>
    <p class="stats" id="stats"></p>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="search" role="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
        placeholder="Gõ câu hỏi hoặc ý cần tìm — có dấu hay không dấu đều được" aria-label="Tìm câu hỏi">
      <button class="clear" id="clear" type="button" aria-label="Xóa tìm kiếm" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <span class="kbd" aria-hidden="true">/</span>
      <button class="sem" id="sem" type="button" data-state="off" aria-live="polite">
        <span class="sem-dot" aria-hidden="true"></span><span class="sem-long"></span><span class="sem-short"></span>
      </button>
    </div>
    <div class="chips" id="topics" role="toolbar" aria-label="Lọc theo chủ đề"></div>
  </div>
</div>

<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Mục lục"></nav>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="resbar" id="resbar"></div>
    <div class="examples" id="examples"></div>
    <div id="list"></div>
  </main>
</div>

<script id="qa-data" type="application/json">{"title":"BỘ CÂU HỎI","subtitle":"Nghiên cứu và phát triển trí tuệ nhân tạo tạo sinh trong quảng bá du lịch tại tỉnh Gia Lai","updated":"01/10/2026","parts":[{"id":"p1","num":"Phần I","title":"Mục tiêu, tính mới và phạm vi"},{"id":"p2","num":"Phần II","title":"Công nghệ AI và dữ liệu"},{"id":"p3","num":"Phần III","title":"An toàn thông tin và bảo vệ dữ liệu"},{"id":"p4","num":"Phần IV","title":"Triển khai, vận hành và rủi ro"}],"sections":[{"id":"1","num":"1","title":"Mục tiêu và tính mới","part":"p1"},{"id":"2","num":"2","title":"Phạm vi kỹ thuật của công cụ tạo kịch bản video/storyboard","part":"p1"},{"id":"3","num":"3","title":"Tích hợp với hệ thống du lịch thông minh hiện có của tỉnh","part":"p1"},{"id":"4","num":"4","title":"Lựa chọn và kiến trúc mô hình ngôn ngữ lớn (LLM)","part":"p2"},{"id":"5","num":"5","title":"Cơ chế truy xuất tăng cường (RAG) và cơ sở dữ liệu véc-tơ","part":"p2"},{"id":"6","num":"6","title":"Quy mô, tính đại diện và bản quyền dữ liệu đầu vào","part":"p2"},{"id":"7","num":"7","title":"Chất lượng đa ngôn ngữ và bản địa hóa nội dung","part":"p2"},{"id":"8","num":"8","title":"Kiểm soát chất lượng nội dung AI tạo sinh (hạn chế sai lệch thông tin)","part":"p2"},{"id":"9","num":"9","title":"Phương pháp đo lường các chỉ tiêu kỹ thuật đã cam kết","part":"p2"},{"id":"10","num":"10","title":"An toàn thông tin của hệ thống","part":"p3"},{"id":"11","num":"11","title":"Bảo vệ dữ liệu cá nhân và tuân thủ pháp lý","part":"p3"},{"id":"12","num":"12","title":"An toàn và bảo mật khi sử dụng mô hình ngôn ngữ lớn (LLM)","part":"p3"},{"id":"13","num":"13","title":"Hạ tầng triển khai, khả năng mở rộng và chi phí vận hành sau nghiệm thu","part":"p4"},{"id":"14","num":"14","title":"Chuyển giao, vận hành và quyền sở hữu kết quả","part":"p4"},{"id":"15","num":"15","title":"Năng lực và phương thức phối hợp của đội ngũ kỹ thuật lõi","part":"p4"},{"id":"16","num":"16","title":"Quản lý rủi ro kỹ thuật","part":"p4"}],"topics":[{"id":"pham-vi","label":"Mục tiêu & phạm vi"},{"id":"kinh-phi","label":"Kinh phí & chi phí"},{"id":"cong-nghe","label":"Công nghệ & kiến trúc"},{"id":"du-lieu","label":"Dữ liệu & bản quyền"},{"id":"chat-luong","label":"Chất lượng & kiểm duyệt"},{"id":"do-luong","label":"Chỉ tiêu & đo lường"},{"id":"ngon-ngu","label":"Ngôn ngữ"},{"id":"bao-mat","label":"An toàn thông tin"},{"id":"ca-nhan","label":"Dữ liệu cá nhân"},{"id":"phap-ly","label":"Pháp lý & tuân thủ"},{"id":"van-hanh","label":"Vận hành & chuyển giao"},{"id":"doi-ngu","label":"Đội ngũ & tiến độ"}],"items":[{"id":"1.1","sec":"1","q":"Sau 24 tháng thực hiện, đề tài đặt mục tiêu hoàn thành những gì?","topics":["pham-vi"],"t":"Sau 24 tháng, đề tài đặt mục tiêu hoàn thành một hệ sinh thái AI tạo sinh phục vụ quảng bá và quản lý du lịch tỉnh Gia Lai, với các kết quả chính gồm:\n• 01 ứng dụng điện thoại trợ lý AI du lịch dành cho du khách, hỗ trợ hỏi đáp đa ngôn ngữ, bản đồ thông minh, gợi ý điểm đến, lịch trình và cá nhân hóa trải nghiệm.\n• 01 nền tảng web dành cho cơ quan quản lý và doanh nghiệp, hỗ trợ tạo nội dung quảng bá, kịch bản video, storyboard, ý tưởng sự kiện và quản lý dữ liệu du lịch.\n• Cơ sở dữ liệu du lịch chuyên biệt của tỉnh Gia Lai, được chuẩn hóa và hỗ trợ tối thiểu 4 ngôn ngữ Việt, Anh, Trung, Nhật.\n• Các mô-đun AI tạo sinh, cơ chế truy xuất dữ liệu, kiểm duyệt nội dung và hạn chế thông tin sai lệch.\n• Bảng điều khiển quản trị, phân tích KPI và API tích hợp với các hệ thống liên quan.\n• Hoàn thành thử nghiệm thực tế, đánh giá, tài liệu kỹ thuật, đào tạo và chuyển giao mã nguồn để đơn vị tiếp nhận có thể tiếp tục vận hành và phát triển hệ thống.","a":"\u003cp>Sau 24 tháng, đề tài đặt mục tiêu hoàn thành một hệ sinh thái AI tạo sinh phục vụ quảng bá và quản lý du lịch tỉnh Gia Lai, với các kết quả chính gồm:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>01 ứng dụng điện thoại trợ lý AI du lịch dành cho du khách, hỗ trợ hỏi đáp đa ngôn ngữ, bản đồ thông minh, gợi ý điểm đến, lịch trình và cá nhân hóa trải nghiệm.\u003c/p>\u003c/li>\n\u003cli>\u003cp>01 nền tảng web dành cho cơ quan quản lý và doanh nghiệp, hỗ trợ tạo nội dung quảng bá, kịch bản video, storyboard, ý tưởng sự kiện và quản lý dữ liệu du lịch.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Cơ sở dữ liệu du lịch chuyên biệt của tỉnh Gia Lai, được chuẩn hóa và hỗ trợ tối thiểu 4 ngôn ngữ Việt, Anh, Trung, Nhật.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Các mô-đun AI tạo sinh, cơ chế truy xuất dữ liệu, kiểm duyệt nội dung và hạn chế thông tin sai lệch.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bảng điều khiển quản trị, phân tích KPI và API tích hợp với các hệ thống liên quan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Hoàn thành thử nghiệm thực tế, đánh giá, tài liệu kỹ thuật, đào tạo và chuyển giao mã nguồn để đơn vị tiếp nhận có thể tiếp tục vận hành và phát triển hệ thống.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"1.2","sec":"1","q":"Điểm mới, khác biệt của hệ thống so với các giải pháp AI du lịch hoặc chatbot hiện có là gì?","topics":["pham-vi"],"t":"Hệ thống không chỉ là chatbot tra cứu thông tin, mà là một hệ sinh thái AI tạo sinh tích hợp trên web và thiết bị di động, phục vụ đồng thời du khách, cơ quan quản lý và doanh nghiệp du lịch. Điểm khác biệt chính là kết hợp trợ lý du lịch đa ngôn ngữ, cá nhân hóa lịch trình, tạo nội dung quảng bá, kịch bản video, storyboard, ý tưởng sự kiện, quản lý dữ liệu và theo dõi hiệu quả truyền thông trên cùng một nền tảng.","a":"\u003cp>Hệ thống không chỉ là chatbot tra cứu thông tin, mà là một hệ sinh thái AI tạo sinh tích hợp trên web và thiết bị di động, phục vụ đồng thời du khách, cơ quan quản lý và doanh nghiệp du lịch. Điểm khác biệt chính là kết hợp trợ lý du lịch đa ngôn ngữ, cá nhân hóa lịch trình, tạo nội dung quảng bá, kịch bản video, storyboard, ý tưởng sự kiện, quản lý dữ liệu và theo dõi hiệu quả truyền thông trên cùng một nền tảng.\u003c/p>"},{"id":"1.3","sec":"1","q":"Những điểm mới này được thể hiện cụ thể như thế nào?","topics":["pham-vi"],"t":"Hệ thống có các điểm nổi bật:\n• Sử dụng cơ sở dữ liệu chuyên biệt về tỉnh Gia Lai và kỹ thuật truy xuất tăng cường để giảm thông tin sai lệch.\n• Hỗ trợ tối thiểu bốn ngôn ngữ: Việt, Anh, Trung và Nhật. Có thể mở rộng ra thêm các ngôn ngữ khác dễ dàng.\n• Cá nhân hóa tư vấn theo sở thích, ngân sách, thời gian lưu trú và mục đích chuyến đi.\n• Tạo nhiều loại nội dung quảng bá như bài viết, khẩu hiệu, kịch bản video, storyboard và ý tưởng sự kiện.\n• Có bảng điều khiển KPI để theo dõi tương tác, xu hướng tìm kiếm và hiệu quả chiến dịch.\n• Tích hợp cơ chế kiểm duyệt của chuyên gia, API mở, mã nguồn và tài liệu kỹ thuật để địa phương chủ động vận hành, cập nhật và mở rộng.\n• Nội dung và giao diện được thiết kế riêng theo bản sắc “rừng – biển – văn hóa bản địa” của tỉnh Gia Lai.","a":"\u003cp>Hệ thống có các điểm nổi bật:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Sử dụng cơ sở dữ liệu chuyên biệt về tỉnh Gia Lai và kỹ thuật truy xuất tăng cường để giảm thông tin sai lệch.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Hỗ trợ tối thiểu bốn ngôn ngữ: Việt, Anh, Trung và Nhật. Có thể mở rộng ra thêm các ngôn ngữ khác dễ dàng.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Cá nhân hóa tư vấn theo sở thích, ngân sách, thời gian lưu trú và mục đích chuyến đi.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Tạo nhiều loại nội dung quảng bá như bài viết, khẩu hiệu, kịch bản video, storyboard và ý tưởng sự kiện.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Có bảng điều khiển KPI để theo dõi tương tác, xu hướng tìm kiếm và hiệu quả chiến dịch.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Tích hợp cơ chế kiểm duyệt của chuyên gia, API mở, mã nguồn và tài liệu kỹ thuật để địa phương chủ động vận hành, cập nhật và mở rộng.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Nội dung và giao diện được thiết kế riêng theo bản sắc “rừng – biển – văn hóa bản địa” của tỉnh Gia Lai.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"1.4","sec":"1","q":"Du khách đã có thể dùng miễn phí ChatGPT, Gemini hay Google Maps; vì sao tỉnh cần đầu tư một hệ thống riêng?","topics":["pham-vi","cong-nghe"],"t":"Các công cụ phổ thông trả lời dựa trên dữ liệu chung trên Internet, không bảo đảm thông tin địa phương chính xác, cập nhật và nhất quán với định hướng quảng bá của tỉnh; tỉnh cũng không thu được dữ liệu về nhu cầu du khách. Hệ thống của đề tài khác ở bốn điểm:\n• Trả lời từ cơ sở dữ liệu du lịch Gia Lai đã kiểm duyệt, có trích dẫn nguồn, do cơ quan quản lý và doanh nghiệp cập nhật (mục 5, 8).\n• Truyền tải thống nhất hình ảnh “rừng – biển – văn hóa bản địa” và thuật ngữ chuẩn hóa trên 4 ngôn ngữ (mục 7).\n• Cung cấp cho Sở dữ liệu tổng hợp về nhu cầu, xu hướng tìm kiếm và hiệu quả truyền thông qua bảng điều khiển KPI.\n• Có nền tảng web hỗ trợ cơ quan quản lý và doanh nghiệp tạo nội dung quảng bá, không chỉ phục vụ du khách.","a":"\u003cp>Các công cụ phổ thông trả lời dựa trên dữ liệu chung trên Internet, không bảo đảm thông tin địa phương chính xác, cập nhật và nhất quán với định hướng quảng bá của tỉnh; tỉnh cũng không thu được dữ liệu về nhu cầu du khách. Hệ thống của đề tài khác ở bốn điểm:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Trả lời từ cơ sở dữ liệu du lịch Gia Lai đã kiểm duyệt, có trích dẫn nguồn, do cơ quan quản lý và doanh nghiệp cập nhật (mục \u003ca class=\"xref\" href=\"#sec-5\" data-sec=\"5\">5\u003c/a>, \u003ca class=\"xref\" href=\"#sec-8\" data-sec=\"8\">8\u003c/a>).\u003c/p>\u003c/li>\n\u003cli>\u003cp>Truyền tải thống nhất hình ảnh “rừng – biển – văn hóa bản địa” và thuật ngữ chuẩn hóa trên 4 ngôn ngữ (mục \u003ca class=\"xref\" href=\"#sec-7\" data-sec=\"7\">7\u003c/a>).\u003c/p>\u003c/li>\n\u003cli>\u003cp>Cung cấp cho Sở dữ liệu tổng hợp về nhu cầu, xu hướng tìm kiếm và hiệu quả truyền thông qua bảng điều khiển KPI.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Có nền tảng web hỗ trợ cơ quan quản lý và doanh nghiệp tạo nội dung quảng bá, không chỉ phục vụ du khách.\u003c/p>\u003c/li>\n\u003c/ul>"},{"id":"1.5","sec":"1","q":"Ngoài sản phẩm phần mềm, đóng góp khoa học của đề tài là gì?","topics":["pham-vi","do-luong"],"t":"Đề tài công bố 01 bài báo trong nước và 01 bài báo quốc tế có phản biện (mục 12.1 Thuyết minh), tập trung vào ba đóng góp:\n• Mô hình ứng dụng AI tạo sinh có kiểm soát (truy xuất tăng cường, kiểm duyệt, đánh giá chất lượng) cho quảng bá du lịch cấp tỉnh.\n• Phương pháp và bộ tiêu chí đánh giá chatbot du lịch đa ngôn ngữ: độ chính xác truy xuất, mức độ hữu ích, độ phù hợp văn hóa.\n• Bằng chứng thực nghiệm về hiệu quả của AI tạo sinh trong sản xuất nội dung và truyền thông du lịch địa phương, so sánh trước – sau khi áp dụng (mục 9).\nCơ sở dữ liệu và bộ câu hỏi kiểm thử cũng có thể tái sử dụng cho các nghiên cứu tiếp theo.","a":"\u003cp>Đề tài công bố 01 bài báo trong nước và 01 bài báo quốc tế có phản biện (mục 12.1 Thuyết minh), tập trung vào ba đóng góp:\u003c/p>\n\u003cul>\n\u003cli>\u003cp>Mô hình ứng dụng AI tạo sinh có kiểm soát (truy xuất tăng cường, kiểm duyệt, đánh giá chất lượng) cho quảng bá du lịch cấp tỉnh.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Phương pháp và bộ tiêu chí đánh giá chatbot du lịch đa ngôn ngữ: độ chính xác truy xuất, mức độ hữu ích, độ phù hợp văn hóa.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bằng chứng thực nghiệm về hiệu quả của AI tạo sinh trong sản xuất nội dung và truyền thông du lịch địa phương, so sánh trước – sau khi áp dụng (mục \u003ca class=\"xref\" href=\"#sec-9\" data-sec=\"9\">9\u003c/a>).\u003c/p>\u003c/li>\n\u003c/ul>\n\u003cp>Cơ sở dữ liệu và bộ câu hỏi kiểm thử cũng có thể tái sử dụng cho các nghiên cứu tiếp theo.\u003c/p>"},{"id":"2.1","sec":"2","q":"Hệ thống có tạo video hoàn chỉnh bằng AI hay chỉ tạo kịch bản, bảng phân cảnh (storyboard) dạng văn bản/hình ảnh minh họa? Công nghệ tạo sinh hình ảnh (nếu có) sử dụng ở mức độ nào?","topics":["pham-vi","cong-nghe"],"t":"Phạm vi kỹ thuật của công cụ được xác định rõ là hỗ trợ tạo ý tưởng, kịch bản, bố cục cảnh quay, lời dẫn, thông điệp chính và bảng phân cảnh dạng văn bản kèm hình ảnh gợi ý/phác thảo minh họa. Hệ thống không cam kết tự động tạo ra video hoàn chỉnh bằng AI tạo sinh. Việc quay dựng video thực tế vẫn do đội ngũ truyền thông của cơ quan quản lý hoặc doanh nghiệp thực hiện, dựa trên kịch bản và storyboard do công cụ AI gợi ý, giúp rút ngắn thời gian lên ý tưởng ban đầu.\nViệc giới hạn phạm vi này bảo đảm tính khả thi trong 24 tháng và trong tổng kinh phí, đồng thời tránh các rủi ro về chất lượng hình ảnh/video và bản quyền nếu sử dụng công nghệ tạo sinh video hoàn chỉnh, vốn còn nhiều hạn chế về độ tin cậy và chi phí ở thời điểm hiện tại.\nBộ 20 mẫu storyboard sẽ được thiết kế sẵn theo các chủ đề quảng bá phổ biến của tỉnh (rừng, biển, văn hóa bản địa, ẩm thực, lễ hội) để đội ngũ sản xuất có thể sử dụng làm điểm khởi đầu và tùy biến.","a":"\u003cp>Phạm vi kỹ thuật của công cụ được xác định rõ là hỗ trợ tạo ý tưởng, kịch bản, bố cục cảnh quay, lời dẫn, thông điệp chính và bảng phân cảnh dạng văn bản kèm hình ảnh gợi ý/phác thảo minh họa. Hệ thống không cam kết tự động tạo ra video hoàn chỉnh bằng AI tạo sinh. Việc quay dựng video thực tế vẫn do đội ngũ truyền thông của cơ quan quản lý hoặc doanh nghiệp thực hiện, dựa trên kịch bản và storyboard do công cụ AI gợi ý, giúp rút ngắn thời gian lên ý tưởng ban đầu.\u003c/p>\n\u003cp>Việc giới hạn phạm vi này bảo đảm tính khả thi trong 24 tháng và trong tổng kinh phí, đồng thời tránh các rủi ro về chất lượng hình ảnh/video và bản quyền nếu sử dụng công nghệ tạo sinh video hoàn chỉnh, vốn còn nhiều hạn chế về độ tin cậy và chi phí ở thời điểm hiện tại.\u003c/p>\n\u003cp>Bộ 20 mẫu storyboard sẽ được thiết kế sẵn theo các chủ đề quảng bá phổ biến của tỉnh (rừng, biển, văn hóa bản địa, ẩm thực, lễ hội) để đội ngũ sản xuất có thể sử dụng làm điểm khởi đầu và tùy biến.\u003c/p>"},{"id":"3.1","sec":"3","q":"Cổng Du lịch thông minh Gia Lai (gialaitourism.vn) đã tồn tại. Hệ thống mới có trùng lặp chức năng không?","topics":["pham-vi","cong-nghe"],"t":"Cổng Du lịch thông minh Gia Lai hiện tại chủ yếu cung cấp chức năng truy cập thông tin dạng cổng thông tin tĩnh, chưa có trợ lý AI hội thoại, chưa cá nhân hóa theo nhu cầu từng du khách và chưa có công cụ hỗ trợ tạo nội dung quảng bá.\nHệ thống của đề tài tập trung nâng cấp bằng công nghệ AI: trợ lý AI hội thoại đa ngôn ngữ, cá nhân hóa trải nghiệm, công cụ tạo nội dung và bảng điều khiển phân tích hiệu quả.","a":"\u003cp>Cổng Du lịch thông minh Gia Lai hiện tại chủ yếu cung cấp chức năng truy cập thông tin dạng cổng thông tin tĩnh, chưa có trợ lý AI hội thoại, chưa cá nhân hóa theo nhu cầu từng du khách và chưa có công cụ hỗ trợ tạo nội dung quảng bá.\u003c/p>\n\u003cp>Hệ thống của đề tài tập trung nâng cấp bằng công nghệ AI: trợ lý AI hội thoại đa ngôn ngữ, cá nhân hóa trải nghiệm, công cụ tạo nội dung và bảng điều khiển phân tích hiệu quả.\u003c/p>"},{"id":"3.2","sec":"3","q":"Việc tích hợp API với hệ thống hiện có của tỉnh (nếu có điều kiện) được thực hiện kỹ thuật như thế nào?","topics":["cong-nghe"],"t":"Trong trường hợp hệ thống hiện tại của tỉnh sẵn sàng tích hợp, nhóm sử dụng Azure API Management (đã có trong dự toán) làm cổng API mở theo chuẩn phổ biến (REST/JSON), kiểm soát truy cập và trao đổi dữ liệu hai chiều, ví dụ đồng bộ danh sách điểm đến và sự kiện, khi đơn vị quản lý cổng thông tin hiện tại cung cấp đặc tả kỹ thuật và sẵn sàng phối hợp.","a":"\u003cp>Trong trường hợp hệ thống hiện tại của tỉnh sẵn sàng tích hợp, nhóm sử dụng Azure API Management (đã có trong dự toán) làm cổng API mở theo chuẩn phổ biến (REST/JSON), kiểm soát truy cập và trao đổi dữ liệu hai chiều, ví dụ đồng bộ danh sách điểm đến và sự kiện, khi đơn vị quản lý cổng thông tin hiện tại cung cấp đặc tả kỹ thuật và sẵn sàng phối hợp.\u003c/p>"},{"id":"4.1","sec":"4","q":"Đề tài dự kiến sử dụng mô hình ngôn ngữ lớn nào? Mô hình mã nguồn mở tự triển khai hay API thương mại (GPT, Gemini, Claude...)?","topics":["cong-nghe"],"t":"Theo dự toán kinh phí đã lập, đề tài dự kiến sử dụng đồng thời hai nền tảng mô hình ngôn ngữ lớn thương mại, OpenAI (180 triệu đồng, khoảng 7.000 USD) và Anthropic (120 triệu đồng, khoảng 5.000 USD), trong tổng khoản dịch vụ thuê ngoài. Việc dùng song song hai nhà cung cấp phục vụ ba mục đích:\n(i) so sánh, đánh giá chất lượng và chi phí giữa các mô hình, làm căn cứ chọn mô hình phù hợp nhất cho từng mô-đun (chatbot hội thoại, tạo nội dung văn bản, tạo kịch bản video);\n(ii) bảo đảm tính dự phòng, tránh gián đoạn dịch vụ khi một nhà cung cấp gặp sự cố hoặc giới hạn truy cập trong giai đoạn cao điểm du lịch;\n(iii) tránh phụ thuộc hoàn toàn vào một nhà cung cấp duy nhất, giảm rủi ro khi chính sách giá hoặc điều khoản sử dụng thay đổi trong 24 tháng triển khai.\nHệ thống được thiết kế để có thể chuyển đổi hoặc bổ sung mô hình khác, kể cả các mô hình mở (open-source).","a":"\u003cp>Theo dự toán kinh phí đã lập, đề tài dự kiến sử dụng đồng thời hai nền tảng mô hình ngôn ngữ lớn thương mại, OpenAI (180 triệu đồng, khoảng 7.000 USD) và Anthropic (120 triệu đồng, khoảng 5.000 USD), trong tổng khoản dịch vụ thuê ngoài. Việc dùng song song hai nhà cung cấp phục vụ ba mục đích:\u003c/p>\n\u003cblockquote>\n\u003cp>(i) so sánh, đánh giá chất lượng và chi phí giữa các mô hình, làm căn cứ chọn mô hình phù hợp nhất cho từng mô-đun (chatbot hội thoại, tạo nội dung văn bản, tạo kịch bản video);\u003c/p>\n\u003cp>(ii) bảo đảm tính dự phòng, tránh gián đoạn dịch vụ khi một nhà cung cấp gặp sự cố hoặc giới hạn truy cập trong giai đoạn cao điểm du lịch;\u003c/p>\n\u003cp>(iii) tránh phụ thuộc hoàn toàn vào một nhà cung cấp duy nhất, giảm rủi ro khi chính sách giá hoặc điều khoản sử dụng thay đổi trong 24 tháng triển khai.\u003c/p>\n\u003c/blockquote>\n\u003cp>Hệ thống được thiết kế để có thể chuyển đổi hoặc bổ sung mô hình khác, kể cả các mô hình mở (open-source).\u003c/p>"},{"id":"4.2","sec":"4","q":"Khoản kinh phí 300 triệu đồng cho API mô hình ngôn ngữ (OpenAI 180 triệu, Anthropic 120 triệu) đủ cho bao nhiêu lượt gọi trong giai đoạn phát triển và được ước tính dựa trên cơ sở nào?","topics":["kinh-phi","cong-nghe"],"t":"Khoản này tương đương khoảng 7.000 USD (OpenAI) và 5.000 USD (Anthropic), tức khoảng 12.000 USD cho 24 tháng. Nhóm ước tính từ khối lượng công việc phát triển và thử nghiệm nêu trong Thuyết minh, tính theo đơn vị là lượt gọi API (một yêu cầu gửi tới mô hình và nhận kết quả):\nHạng mục (căn cứ Thuyết minh) | Cơ sở ước tính | Số lượt gọi\nSo sánh, chọn mô hình cho từng mô-đun (Nội dung 2) | 300 câu hỏi kiểm thử × 4 ngôn ngữ × 6 cấu hình mô hình, kèm chấm điểm; 100 yêu cầu tạo nội dung × 4 ngôn ngữ × 6 cấu hình | 16.800\nTinh chỉnh truy xuất (RAG) và prompt (Nội dung 2–3) | 500 câu hỏi × 4 ngôn ngữ × 15 vòng lặp, kèm chấm điểm | 60.000\nXử lý, chuẩn hóa, dịch dữ liệu du lịch (Nội dung 3) | Khoảng 2.000 đoạn dữ liệu × 5 tác vụ (tóm tắt, gắn siêu dữ liệu, dịch sang 4 ngôn ngữ) × 2 lượt chạy | 20.000\nDữ liệu tổng hợp phục vụ chưng cất, hiệu chỉnh mô hình (Nội dung 2) | Sinh cặp hỏi – đáp và tình huống hội thoại theo 4 ngôn ngữ | 20.000\nCông cụ tạo nội dung, kịch bản, storyboard (Nội dung 5) | 7 loại nội dung × 50 yêu cầu mẫu × 4 ngôn ngữ × 10 vòng; 20 mẫu storyboard × 4 ngôn ngữ × 20 vòng | 15.600\nKiểm thử tích hợp và hồi quy (Nội dung 4, 7) | 200 ca kiểm thử × khoảng 300 lần phát hành/chạy | 60.000\nKiểm thử an toàn đối kháng và kiểm thử tải (Nội dung 7) | 2.000 câu lệnh tấn công × 5 lần chạy; 5.000 lượt đo thời gian phản hồi | 15.000\nCộng giai đoạn phát triển |  | 207.400\nThử nghiệm với người dùng (Bước 6) | Khoảng 40.000 lượt hỏi đáp trong giai đoạn thử nghiệm | 40.000\nTổng |  | khoảng 247.000\nGiả định tính chi phí:\n• Một lượt hỏi đáp có ngữ cảnh truy xuất: khoảng 4.000 token đầu vào và 600 token đầu ra (tiếng Việt, Trung, Nhật tốn nhiều token hơn tiếng Anh); một tác vụ tạo nội dung hoặc kịch bản: 2.500–3.000 token đầu vào và 1.500–3.000 token đầu ra.\n• Đơn giá niêm yết tháng 9/2026 (USD cho một triệu token đầu vào/đầu ra): mô hình hàng đầu của OpenAI (GPT-5.5) là 5/30, Claude cỡ Sonnet là 3/15; mô hình nhỏ GPT-5.4-mini là 0,75/4,5, Claude Haiku 4.5 là 1/5. Mô hình hàng đầu được cộng thêm 50% token đầu ra cho phần suy luận. Chưa tính ưu đãi bộ nhớ đệm prompt và Batch API.\n• Số lượt gọi chia cho hai nhà cung cấp theo tỷ lệ ngân sách (7:5) để so sánh trực tiếp giữa các mô hình.\nKết quả:\n• Kế hoạch cần khoảng 247.000 lượt gọi. Nếu toàn bộ chạy trên mô hình hàng đầu (kịch bản chi phí cao nhất), chi phí khoảng 10.500 USD, nằm trong mức 12.000 USD và còn dự phòng khoảng 14% cho biến động giá và số vòng lặp.\n• Nếu chuyển các tác vụ khối lượng lớn (kiểm thử hồi quy, chấm điểm, xử lý dữ liệu) sang mô hình nhỏ, cùng khối lượng chỉ khoảng 3.400 USD. Phần chênh lệch là dư địa để tăng khối lượng thử nghiệm: với cơ cấu trên, ngân sách đủ cho khoảng 280.000 lượt (toàn bộ dùng mô hình hàng đầu) đến 870.000 lượt (chuyển tác vụ khối lượng lớn sang mô hình nhỏ).","a":"\u003cp>Khoản này tương đương khoảng 7.000 USD (OpenAI) và 5.000 USD (Anthropic), tức khoảng 12.000 USD cho 24 tháng. Nhóm ước tính từ khối lượng công việc phát triển và thử nghiệm nêu trong Thuyết minh, tính theo đơn vị là lượt gọi API (một yêu cầu gửi tới mô hình và nhận kết quả):\u003c/p>\n\u003cdiv class=\"tbl num-last\">\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>\u003cstrong>Hạng mục (căn cứ Thuyết minh)\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>Cơ sở ước tính\u003c/strong>\u003c/th>\n\u003cth>\u003cstrong>Số lượt gọi\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>So sánh, chọn mô hình cho từng mô-đun (Nội dung 2)\u003c/td>\n\u003ctd>300 câu hỏi kiểm thử × 4 ngôn ngữ × 6 cấu hình mô hình, kèm chấm điểm; 100 yêu cầu tạo nội dung × 4 ngôn ngữ × 6 cấu hình\u003c/td>\n\u003ctd>16.800\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tinh chỉnh truy xuất (RAG) và prompt (Nội dung 2–3)\u003c/td>\n\u003ctd>500 câu hỏi × 4 ngôn ngữ × 15 vòng lặp, kèm chấm điểm\u003c/td>\n\u003ctd>60.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Xử lý, chuẩn hóa, dịch dữ liệu du lịch (Nội dung 3)\u003c/td>\n\u003ctd>Khoảng 2.000 đoạn dữ liệu × 5 tác vụ (tóm tắt, gắn siêu dữ liệu, dịch sang 4 ngôn ngữ) × 2 lượt chạy\u003c/td>\n\u
